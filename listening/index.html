'use strict';

const quizConfig = {
 audioFileUrl:"https://raw.githubusercontent.com/Teacher-Soufiane/unit5-listening/main/Unit5_Expressing_Concession_Intro_and_Listening.mp3",
 transcript:[
 ["Michael","Layla, do you think working women have more difficulties than working men when managing family life?"],
 ["Layla","Yes, I do. Although many women have full-time jobs, they are still expected to do most of the housework."],
 ["Michael","I understand, but managing a job and a family is difficult for men, too."],
 ["Layla","That's true. However, women often face extra pressure because people expect them to take care of the children and the home."],
 ["Michael","Despite having demanding jobs, some women manage to organise their time quite well."],
 ["Layla","That's possible, but good organisation cannot solve every problem, especially when there is little support at home."],
 ["Michael","Even though both partners may be tired after work, shouldn't they share household responsibilities equally?"],
 ["Layla","Absolutely! In spite of working long hours, many women still spend their evenings cooking, cleaning, and helping their children."],
 ["Michael","Perhaps couples should discuss their responsibilities and make a fair schedule."],
 ["Layla","I agree. Although changing traditional attitudes takes time, sharing the housework would reduce women's stress."],
 ["Michael","Some employers could also offer flexible working hours to help parents."],
 ["Layla","Yes, but even though flexible hours are useful, not every workplace offers them."],
 ["Michael","That's a fair point. Despite these difficulties, many women continue to succeed in their careers."],
 ["Layla","They do, but success shouldn't mean sacrificing their health or personal lives."],
 ["Michael","I agree. In spite of facing different challenges, both men and women deserve support."],
 ["Layla","Exactly. However, families and employers must recognise that women cannot be expected to do everything alone."],
 ["Michael","So, a fairer balance requires cooperation at home and understanding at work."],
 ["Layla","Definitely. Although balancing work and family isn't always easy, sharing responsibilities can make life better for everyone."]
 ],
 questions:[
 {type:"single",taskLabel:"Task 1 — Complete the Sentence",question:"COMPLETE THE SENTENCE.",task:"______ she works long hours, she cooks dinner every evening.",choices:["Despite","Although","In spite of","However"],correctAnswer:"Although",explanation:"'Although' is followed by a complete clause (she works long hours).",points:1},
 {type:"single",taskLabel:"Task 1 — Complete the Sentence",question:"COMPLETE THE SENTENCE.",task:"______ the heavy traffic, he arrived at work on time.",choices:["Although","Even though","Despite","However"],correctAnswer:"Despite",explanation:"'Despite' is followed by a noun phrase (the heavy traffic).",points:1},
 {type:"single",taskLabel:"Task 1 — Complete the Sentence",question:"COMPLETE THE SENTENCE.",task:"He was very tired. ______, he helped with the housework.",choices:["Although","However","Despite","Even though"],correctAnswer:"However",explanation:"'However' links two separate sentences and introduces a contrasting idea.",points:1},
 {type:"single",taskLabel:"Task 1 — Complete the Sentence",question:"COMPLETE THE SENTENCE.",task:"She went to work ______ being ill.",choices:["although","even though","in spite of","however"],correctAnswer:"in spite of",explanation:"'In spite of' is followed by a gerund (-ing) phrase (being ill).",points:1},
 {type:"matching",taskLabel:"Task 2 — Match the Word with its Meaning",question:"MATCH THE WORD WITH ITS MEANING.",task:"Drag each word to the meaning it matches.",rows:[["r1","Cleaning, cooking and other jobs done at home"],["r2","A feeling of being forced to meet expectations"],["r3","A plan showing what will be done and when"],["r4","A person or company that pays people to work"],["r5","Able to change easily to suit different needs"]],chips:[["c1","housework","r1"],["c2","pressure","r2"],["c3","schedule","r3"],["c4","employer","r4"],["c5","flexible","r5"]],explanation:"These five words appear in the conversation: housework, pressure, schedule, employer and flexible.",points:5},
 {type:"multi",taskLabel:"Task 3 — Predict the Listening",question:"PREDICT THE LISTENING.",task:"You are going to hear two adults discussing the topic 'Working Women'. Which topics are you most likely to hear? Select THREE.",options:["Working women and household duties","A football match on television","Sharing housework between partners","A trip to the mountains","Flexible working hours for parents","A fashion shopping day"],correctOptions:["Working women and household duties","Sharing housework between partners","Flexible working hours for parents"],explanation:"The speakers discuss working women and household duties, sharing housework between partners, and flexible working hours for parents. The other topics are unrelated.",points:3},
 {type:"single",taskLabel:"Task 4 — Choose the Best Summary",question:"CHOOSE THE BEST SUMMARY.",task:"What is the conversation mainly about?",choices:["Two colleagues plan a company event for all their employees.","Two friends compare the salaries of men and women in banks.","Two neighbours argue about noise coming from a nearby building.","Two adults debate whether working women face unfair household pressure."],correctAnswer:"Two adults debate whether working women face unfair household pressure.",explanation:"Michael and Layla discuss whether working women face extra pressure when balancing a career and household responsibilities.",points:1},
 {type:"single",taskLabel:"Task 5 — Identify the Main Argument",question:"IDENTIFY THE MAIN ARGUMENT.",task:"What is Layla's main argument?",choices:["Women have too many holidays compared with men.","Men should stay at home and look after children.","Society expects women to do most of the housework.","Working women never need any help from partners."],correctAnswer:"Society expects women to do most of the housework.",explanation:"Layla says women are still expected to do most of the housework and to take care of the children and the home.",points:1},
 {type:"matching",taskLabel:"Task 6 — Complete the Concession Sentence",question:"COMPLETE THE CONCESSION SENTENCE.",task:"Drag each ending to the beginning it completes.",rows:[["r1","Despite having demanding jobs,"],["r2","In spite of working long hours,"],["r3","Even though flexible hours are useful,"],["r4","Although changing traditional attitudes takes time,"]],chips:[["c1","some women organise their time quite well.","r1"],["c2","many women still cook and clean every evening.","r2"],["c3","not every workplace offers them.","r3"],["c4","sharing the housework would reduce women's stress.","r4"]],explanation:"Each concession sentence in the conversation joins a difficulty with a contrasting result, using despite, in spite of, even though and although.",points:4},
 {type:"single",taskLabel:"Task 7 — Understand the Reason",question:"UNDERSTAND THE REASON.",task:"According to Layla, why do women face extra pressure?",choices:["Because employers always pay them much less than men","Because they always work longer hours than their partners","Because people expect them to care for children and home","Because they refuse to share any household responsibilities"],correctAnswer:"Because people expect them to care for children and home",explanation:"Layla says women face extra pressure because people expect them to take care of the children and the home.",points:1},
 {type:"single",taskLabel:"Task 8 — Understand the Suggestion",question:"UNDERSTAND THE SUGGESTION.",task:"What does Michael suggest couples should do?",choices:["Hire someone to help with the cleaning","Discuss their responsibilities and make a fair schedule","Work fewer hours than their employers expect","Move closer to their families for support"],correctAnswer:"Discuss their responsibilities and make a fair schedule",explanation:"Michael suggests that couples discuss their responsibilities and make a fair schedule.",points:1},
 {type:"single",taskLabel:"Task 9 — Listen for a Detail",question:"LISTEN FOR A DETAIL.",task:"What does Michael say employers could offer to help parents?",choices:["Free childcare inside the office building","Higher salaries for all of their staff","Flexible working hours for parents","Extra paid holidays during the whole year"],correctAnswer:"Flexible working hours for parents",explanation:"Michael says some employers could offer flexible working hours to help parents.",points:1},
 {type:"single",taskLabel:"Task 10 — Understand the Reservation",question:"UNDERSTAND THE RESERVATION.",task:"Why does Layla say flexible hours are not enough?",choices:["Because they make employees work longer","Because most parents don't want them at all","Because not every workplace offers them","Because they cost employers too much money"],correctAnswer:"Because not every workplace offers them",explanation:"Layla says that even though flexible hours are useful, not every workplace offers them.",points:1},
 {type:"single",taskLabel:"Task 11 — True or False",question:"CHOOSE TRUE OR FALSE.",task:"Michael says managing a job and a family is difficult only for women.",choices:["True","False"],correctAnswer:"False",explanation:"Michael says managing a job and a family is difficult for men, too.",points:1},
 {type:"single",taskLabel:"Task 11 — True or False",question:"CHOOSE TRUE OR FALSE.",task:"Layla thinks good organisation cannot solve every problem.",choices:["True","False"],correctAnswer:"True",explanation:"Layla says good organisation cannot solve every problem, especially when there is little support at home.",points:1},
 {type:"single",taskLabel:"Task 11 — True or False",question:"CHOOSE TRUE OR FALSE.",task:"Michael suggests that employers could offer flexible working hours.",choices:["True","False"],correctAnswer:"True",explanation:"Michael says some employers could offer flexible working hours to help parents.",points:1},
 {type:"single",taskLabel:"Task 11 — True or False",question:"CHOOSE TRUE OR FALSE.",task:"Layla says changing traditional attitudes is quick and easy.",choices:["True","False"],correctAnswer:"False",explanation:"Layla says changing traditional attitudes takes time.",points:1},
 {type:"single",taskLabel:"Task 12 — Identify the Expression",question:"IDENTIFY THE EXPRESSION.",task:"\"Although many women have full-time jobs, they are still expected to do most of the housework.\" Which concession expression is used?",choices:["Although","However","Despite","In spite of"],correctAnswer:"Although",explanation:"The sentence uses 'Although' followed by a complete clause.",points:1},
 {type:"single",taskLabel:"Task 12 — Identify the Expression",question:"IDENTIFY THE EXPRESSION.",task:"\"Despite having demanding jobs, some women manage to organise their time quite well.\" Which concession expression is used?",choices:["Although","Despite","However","Even though"],correctAnswer:"Despite",explanation:"The sentence uses 'Despite' followed by a gerund phrase (having demanding jobs).",points:1},
 {type:"single",taskLabel:"Task 12 — Identify the Expression",question:"IDENTIFY THE EXPRESSION.",task:"\"In spite of working long hours, many women still spend their evenings cooking, cleaning, and helping their children.\" Which concession expression is used?",choices:["Even though","However","In spite of","Although"],correctAnswer:"In spite of",explanation:"The sentence uses 'In spite of' followed by a gerund phrase (working long hours).",points:1},
 {type:"single",taskLabel:"Task 12 — Identify the Expression",question:"IDENTIFY THE EXPRESSION.",task:"\"However, women often face extra pressure because people expect them to take care of the children and the home.\" Which concession expression is used?",choices:["Although","Despite","However","Even though"],correctAnswer:"However",explanation:"The sentence uses 'However' to introduce a contrasting idea in a new sentence.",points:1},
 {type:"single",taskLabel:"Task 13 — Understand the Contrast",question:"UNDERSTAND THE CONTRAST.",task:"\"Despite having demanding jobs, some women manage to organise their time quite well.\" What contrast does Michael express?",choices:["Women have easy jobs, so they organise their time well.","Women have difficult jobs, but some still organise their time well.","Women organise their time well because they have no jobs.","Women with demanding jobs never manage their time at all."],correctAnswer:"Women have difficult jobs, but some still organise their time well.",explanation:"'Despite' shows a contrast between demanding jobs and good time organisation.",points:1},
 {type:"single",taskLabel:"Task 14 — Identify the Structure",question:"IDENTIFY THE STRUCTURE.",task:"In \"In spite of working long hours, many women still spend their evenings cooking\", what follows 'in spite of'?",choices:["An infinitive with to","A gerund (-ing) phrase","A complete clause with a subject","A question with an auxiliary"],correctAnswer:"A gerund (-ing) phrase",explanation:"'In spite of' is followed by a noun, noun phrase or gerund; here it is followed by 'working long hours'.",points:1},
 {type:"single",taskLabel:"Task 15 — Choose the Correct Expression",question:"CHOOSE THE CORRECT EXPRESSION.",task:"______ the rain, the match went ahead as planned.",choices:["Although","Despite","However","Even though"],correctAnswer:"Despite",explanation:"A noun phrase follows the gap (the rain), so 'Despite' is correct.",points:1},
 {type:"single",taskLabel:"Task 15 — Choose the Correct Expression",question:"CHOOSE THE CORRECT EXPRESSION.",task:"______ she was tired, she finished the report.",choices:["Despite","In spite of","However","Although"],correctAnswer:"Although",explanation:"A complete clause follows the gap (she was tired), so 'Although' is correct.",points:1},
 {type:"single",taskLabel:"Task 15 — Choose the Correct Expression",question:"CHOOSE THE CORRECT EXPRESSION.",task:"He is very rich. ______, he is not happy.",choices:["Although","Despite","However","In spite of"],correctAnswer:"However",explanation:"'However' introduces a contrasting idea in a new sentence.",points:1},

const $=id=>document.getElementById(id);
const state={index:0,answers:Array(32).fill(null),views:Array(32).fill(null),score:0};
function shuffleDifferent(items,identity){let result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}if(result.every((item,i)=>identity(item,i)))[result[0],result[1]]=[result[1],result[0]];return result}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function button(text,cls,fn){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function phaseFor(i){return i<6?"PRE-LISTENING":i<8?"WHILE-LISTENING — First Listening: General Understanding":i<17?"WHILE-LISTENING — Second Listening: Specific Information":i<23?"WHILE-LISTENING — Third Listening: Understanding the Function":"POST-LISTENING"}
function fmt(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}

/* Independent count-up timer; navigation never resets it. */
const timer={seconds:0,id:null,start(){if(!this.id)this.id=setInterval(()=>{this.seconds++;$('stat-timer').textContent=`Timer ${fmt(this.seconds)}`},1000)},pause(){clearInterval(this.id);this.id=null},reset(){this.pause();this.seconds=0}};

/* Sandboxed Canva playback uses Web Audio rather than blocked HTML audio elements.
   Download/decode once at Q7. The Play click synchronously resumes the context
   and starts an already-decoded source. Seeking never wraps across either edge. */
const audioPlayer={
 context:null,buffer:null,source:null,startedAt:0,position:0,playing:false,loading:false,failed:false,raf:0,
 async loadOnce(){if(this.buffer||this.loading||this.failed)return;this.loading=true;try{const response=await fetch(quizConfig.audioFileUrl);if(!response.ok)throw Error(`Audio HTTP ${response.status}`);const data=await response.arrayBuffer();this.context??=new(window.AudioContext||window.webkitAudioContext)();this.buffer=await this.context.decodeAudioData(data);this.update()}catch(error){this.failed=true;$('audio-error').textContent="Audio couldn't be loaded — ask your teacher for the printed transcript.";this.update()}finally{this.loading=false}},
 now(){return this.playing?Math.min(this.buffer.duration,this.context.currentTime-this.startedAt):this.position},
 update(){const ready=!!this.buffer&&!this.failed;['play-audio','skip-back','skip-forward'].forEach(id=>$(id).disabled=!ready);$('play-audio').textContent=this.playing?'⏸':'▶';const p=ready?100*this.now()/this.buffer.duration:0;$('progress-fill').style.width=`${p}%`;document.querySelector('.progress').setAttribute('aria-valuenow',String(Math.round(p)))},
 play(){if(!this.buffer||this.playing)return;const ctx=this.context;const promise=ctx.resume();this.source=ctx.createBufferSource();this.source.buffer=this.buffer;this.source.connect(ctx.destination);this.startedAt=ctx.currentTime-this.position;this.source.onended=()=>{if(!this.playing)return;this.position=this.buffer.duration;this.playing=false;this.source=null;this.update()};try{this.source.start(0,this.position);this.playing=true;this.update();const tick=()=>{this.update();if(this.playing)this.raf=requestAnimationFrame(tick)};tick();Promise.resolve(promise).catch(error=>{console.error(error);this.pause();this.update()})}catch(error){console.error(error);this.playing=false;this.source=null;this.update()}},
 pause(){if(!this.playing)return;this.position=this.now();this.playing=false;cancelAnimationFrame(this.raf);if(this.source){this.source.onended=null;this.source.stop();this.source.disconnect();this.source=null}this.update()},
 seek(time){if(!this.buffer)return;const playing=this.playing;this.pause();this.position=Math.max(0,Math.min(this.buffer.duration,time));this.update();if(playing&&this.position<this.buffer.duration)this.play()},
 reset(){this.pause();this.position=0;this.update()}
};
$('play-audio').addEventListener('click',()=>{if(audioPlayer.playing)audioPlayer.pause();else audioPlayer.play()});
$('skip-back').addEventListener('click',()=>audioPlayer.seek(Math.max(0,audioPlayer.now()-10)));
$('skip-forward').addEventListener('click',()=>audioPlayer.seek(Math.min(audioPlayer.buffer.duration,audioPlayer.now()+10)));

/* Soft synthesized feedback is suppressed while dialogue playback is active. */
function sound(kind){if(audioPlayer.playing)return;try{const context=audioPlayer.context??new(window.AudioContext||window.webkitAudioContext)();audioPlayer.context=context;const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='sine';oscillator.frequency.value=kind==='wrong'?260:kind==='complete'?690:kind==='click'?470:540;gain.gain.setValueAtTime(.0001,context.currentTime);gain.gain.exponentialRampToValueAtTime(.075,context.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime+.16);oscillator.connect(gain).connect(context.destination);oscillator.start();oscillator.stop(context.currentTime+.17)}catch(_){}}
function stats(){const answered=state.answers.filter(Boolean),correct=answered.filter(a=>a.points===quizConfig.questions[a.index].points).length;$('stat-correct').textContent=`✅ Correct: ${correct}`;$('stat-wrong').textContent=`❌ Wrong: ${answered.length-correct}`;$('stat-remaining').textContent=`Remaining: ${32-answered.length}`;$('stat-score').textContent=`Score: ${state.score.toFixed(2)} /48`;$('stat-timer').textContent=`Timer ${fmt(timer.seconds)}`}
function feedback(q,points){const f=$('feedback');f.replaceChildren(el('strong','',points===q.points?'Well done!':points?'Some answers are correct.':'Keep practising!'),el('p','',q.explanation));sound(points===q.points?'correct':'wrong')}
function grade(points,detail){const i=state.index,q=quizConfig.questions[i];if(state.answers[i])return;state.answers[i]={index:i,points,detail};state.score+=points;feedback(q,points);stats();$('next').disabled=false}

/* Single-choice options are shuffled exactly once, on first entry. A click only
   changes classes on the existing nodes; it never recreates or moves choices. */
function renderSingle(q,view,area){
 if(!view.choices)view.choices=shuffleDifferent(q.choices,()=>false);
 view.choices.forEach(choice=>{const b=button(choice,'choice',()=>{if(state.answers[state.index])return;grade(choice===q.correctAnswer?1:0,{choice});area.querySelectorAll('button').forEach(node=>{node.disabled=true;if(node.textContent===q.correctAnswer)node.classList.add('correct');else if(node===b)node.classList.add('wrong')})});area.append(b);if(state.answers[state.index]){b.disabled=true;if(choice===q.correctAnswer)b.classList.add('correct');else if(choice===state.answers[state.index].detail.choice)b.classList.add('wrong')}})
}

/* Prediction: selections live in one Set. A 500 ms delay permits deselecting
   the third option; evaluation then locks and grades the exact set. */
function renderMulti(q,view,area){
 view.options??=shuffleDifferent(q.options,()=>false);view.selected??=new Set();
 const grid=el('div','tile-grid');area.append(grid);
 const paint=()=>{grid.querySelectorAll('button').forEach(b=>{const selected=view.selected.has(b.textContent),answer=state.answers[state.index];b.className='tile'+(selected?' selected':'');if(answer){b.disabled=true;b.className='tile '+(q.correctOptions.includes(b.textContent)?'correct':selected?'wrong':'muted')}})};
 view.options.forEach(option=>grid.append(button(option,'tile',()=>{if(state.answers[state.index])return;clearTimeout(view.pending);if(view.selected.has(option))view.selected.delete(option);else if(view.selected.size<3)view.selected.add(option);sound('click');paint();if(view.selected.size===3)view.pending=setTimeout(()=>{if(view.selected.size!==3||state.answers[state.index])return;const selected=[...view.selected],correct=selected.every(x=>q.correctOptions.includes(x));grade(correct?3:0,{selected});paint()},500)})));
 paint()
}

/* Pointer Events drag shared by matching and ordering. Pointer capture ensures
   touch and mouse release events arrive even after crossing another element. */
function pointerDrag(target,onDrop){target.addEventListener('pointerdown',e=>{if(e.button!==0||target.getAttribute('aria-disabled')==='true')return;const startX=e.clientX,startY=e.clientY;target.setPointerCapture(e.pointerId);let moved=false;const move=event=>{const dx=event.clientX-startX,dy=event.clientY-startY;if(Math.hypot(dx,dy)>5)moved=true;if(moved){target.classList.add('dragging');target.style.transform=`translate(${dx}px,${dy}px)`}};const finish=event=>{target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',finish);target.removeEventListener('pointercancel',cancel);target.style.transform='';target.classList.remove('dragging');if(moved)onDrop(event.clientX,event.clientY)};const cancel=()=>{target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',finish);target.removeEventListener('pointercancel',cancel);target.style.transform='';target.classList.remove('dragging')};target.addEventListener('pointermove',move);target.addEventListener('pointerup',finish);target.addEventListener('pointercancel',cancel)})}

/* Matching accepts every placement and replacement before Check Answers.
   Clicking a chip and then a slot is an additional keyboard/touch alternative. */
function renderMatching(q,view,area){
 view.chipOrder??=shuffleDifferent(q.chips, (chip,i)=>chip[2]===q.rows[i][0]);view.slots??={};const wrapper=el('div','match-layout'),rows=el('div','match-rows'),tray=el('div','tray');wrapper.append(rows,tray);area.append(wrapper);
 const answer=state.answers[state.index],chipsById=Object.fromEntries(q.chips.map(c=>[c[0],c])),chipNodes={};
 const refresh=()=>{tray.replaceChildren();q.rows.forEach(row=>{const slot=rows.querySelector(`[data-row="${row[0]}"]`);slot.replaceChildren();const id=view.slots[row[0]];if(id)slot.append(chipNodes[id]);if(answer){const correct=q.chips.find(c=>c[2]===row[0]);slot.classList.add(id===correct[0]?'correct':'wrong');if(id!==correct[0])slot.append(el('small','answer-note',`Correct: ${correct[1]}`))}});view.chipOrder.forEach(chip=>{if(!Object.values(view.slots).includes(chip[0]))tray.append(chipNodes[chip[0]])});check.disabled=Object.keys(view.slots).length!==q.rows.length||!!answer;check.hidden=!!answer};
 const place=(id,rowId)=>{if(state.answers[state.index])return;Object.keys(view.slots).forEach(k=>{if(view.slots[k]===id)delete view.slots[k]});const displaced=view.slots[rowId];view.slots[rowId]=id;if(displaced)delete view.slots[Object.keys(view.slots).find(k=>k!==rowId&&view.slots[k]===displaced)];sound('click');refresh()};
 q.rows.forEach(row=>{const box=el('div','match-row'),slot=el('div','slot');slot.dataset.row=row[0];slot.tabIndex=0;slot.setAttribute('role','button');slot.setAttribute('aria-label',`Place selected chip beside ${row[1]}`);slot.addEventListener('click',()=>{if(view.keyboardChip)place(view.keyboardChip,row[0])});slot.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&view.keyboardChip){e.preventDefault();place(view.keyboardChip,row[0])}});box.append(el('div','row-text',row[1]),slot);rows.append(box)});
 view.chipOrder.forEach(chip=>{const node=el('div','chip',chip[1]);node.tabIndex=answer?-1:0;node.setAttribute('role','button');node.setAttribute('aria-label',`Select ${chip[1]} to place in a row`);node.setAttribute('aria-disabled',String(!!answer));node.addEventListener('click',()=>{view.keyboardChip=chip[0];Object.values(chipNodes).forEach(n=>n.classList.remove('selected'));node.classList.add('selected')});node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();node.click()}});pointerDrag(node,(x,y)=>{const destination=document.elementFromPoint(x,y)?.closest('.slot');if(destination&&rows.contains(destination))place(chip[0],destination.dataset.row);else if(document.elementFromPoint(x,y)?.closest('.tray')){Object.keys(view.slots).forEach(k=>{if(view.slots[k]===chip[0])delete view.slots[k]});refresh()}});chipNodes[chip[0]]=node});
 const check=button('Check Answers','action',()=>{if(Object.keys(view.slots).length!==q.rows.length)return;const points=q.rows.filter(r=>chipsById[view.slots[r[0]]]?.[2]===r[0]).length;grade(points,{slots:{...view.slots}});refresh()});area.append(check);refresh()
}

/* Ordering maintains one array for both Pointer Events dragging and ▲/▼.
   Check Answers evaluates positions once and reveals the correct sequence. */
function renderOrdering(q,view,area){
 view.order??=shuffleDifferent(q.items.map(i=>i[0]),(id,i)=>id===q.items[i][0]);
 const list=el('div','order-list'),check=button('Check Answers','action',()=>{const score=view.order.filter((id,i)=>id===q.items[i][0]).length;grade(score,{order:[...view.order]});renderItems();if(!area.querySelector('.correct-order')){const correct=el('div','feedback correct-order');correct.append(el('strong','','Correct order'));q.items.forEach((item,i)=>correct.append(el('p','',`${i+1}. ${item[1]}`)));area.append(correct)}});area.append(list,check);
 const move=(from,to)=>{if(state.answers[state.index]||to<0||to>=view.order.length||from===to)return;const [item]=view.order.splice(from,1);view.order.splice(to,0,item);sound('click');renderItems()};
 function renderItems(){list.replaceChildren();const locked=!!state.answers[state.index];check.hidden=locked;view.order.forEach((id,index)=>{const item=q.items.find(i=>i[0]===id),row=el('div','order-item'+(locked?(id===q.items[index][0]?' correct':' wrong'):'')),drag=el('div','order-drag',item[1]),controls=el('div','move-controls');drag.tabIndex=locked?-1:0;drag.setAttribute('role','button');drag.setAttribute('aria-label',`Drag to reorder: ${item[1]}`);drag.setAttribute('aria-disabled',String(locked));pointerDrag(drag,(x,y)=>{const target=document.elementFromPoint(x,y)?.closest('.order-item');if(target&&list.contains(target))move(view.order.indexOf(id),Number(target.dataset.position))});row.dataset.position=index;controls.append(button('▲','move-button',()=>move(index,index-1)),button('▼','move-button',()=>move(index,index+1)));controls.querySelectorAll('button').forEach(b=>b.disabled=locked);row.append(drag,controls);list.append(row)})}
 renderItems();if(state.answers[state.index]){const correct=el('div','feedback correct-order');correct.append(el('strong','','Correct order'));q.items.forEach((item,i)=>correct.append(el('p','',`${i+1}. ${item[1]}`)));area.append(correct)}
}
function renderQuestion(){
 const i=state.index,q=quizConfig.questions[i],view=state.views[i]??(state.views[i]={});$('phase').textContent=phaseFor(i);
 $('audio-panel').hidden=i<6;if(i>=6)audioPlayer.loadOnce();
 $('instruction').textContent=q.question;$('task').textContent=q.task;$('counter').textContent=`${i+1} / 32`;
 $('answer').replaceChildren();$('feedback').replaceChildren();
 if(q.type==='single')renderSingle(q,view,$('answer'));
 else if(q.type==='multi')renderMulti(q,view,$('answer'));
 else if(q.type==='matching')renderMatching(q,view,$('answer'));
 else renderOrdering(q,view,$('answer'));
 if(state.answers[i])feedbackText(q,state.answers[i].points);
 $('previous').disabled=i===0;$('next').disabled=!state.answers[i];$('next').textContent=i===31?'See Results ▶':'Next ▶';stats()
}
function feedbackText(q,points){$('feedback').replaceChildren(el('strong','',points===q.points?'Well done!':points?'Some answers are correct.':'Keep practising!'),el('p','',q.explanation))}
$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;renderQuestion()}});
$('next').addEventListener('click',()=>{if(!state.answers[state.index])return;if(state.index===31)showResults();else{state.index++;renderQuestion()}});
document.addEventListener('keydown',e=>{if($('quiz-screen').hidden||e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;if(t.closest('.audio-controls')){if(e.key===' '){e.preventDefault();$('play-audio').click()}else if(e.key==='ArrowLeft'){e.preventDefault();$('skip-back').click()}else if(e.key==='ArrowRight'){e.preventDefault();$('skip-forward').click()}return}if(t.closest('button,.chip,.slot,summary'))return;if(e.key==='ArrowLeft')$('previous').click();else if(e.key==='ArrowRight')$('next').click();else if(/^[1-6]$/.test(e.key)){const choices=$('answer').querySelectorAll('.choice,.tile');choices[Number(e.key)-1]?.click()}});

function transcript(){const details=el('details','transcript'),summary=el('summary','','Show Transcript'),body=el('div');quizConfig.transcript.forEach(([speaker,text])=>{const p=el('p');p.append(el('strong','',`${speaker}: `),document.createTextNode(text));body.append(p)});details.append(summary,body);return details}
function breakdown(){const tasks=new Map();quizConfig.questions.forEach((q,i)=>{const x=tasks.get(q.taskLabel)||{earned:0,total:0};x.earned+=state.answers[i]?.points||0;x.total+=q.points;tasks.set(q.taskLabel,x)});return tasks}
function recordResult(){try{const attempts=Number(localStorage.getItem('concession-attempts')||0)+1,best=Math.max(Number(localStorage.getItem('concession-best')||0),state.score);localStorage.setItem('concession-attempts',String(attempts));localStorage.setItem('concession-best',String(best));localStorage.setItem('concession-last',String(state.score));localStorage.setItem('concession-time',fmt(timer.seconds));return{attempts,best}}catch(_){return{attempts:1,best:state.score}}}
let storedResult={attempts:1,best:0},remarkInterval;
function showResults(){timer.pause();audioPlayer.pause();storedResult=recordResult();$('quiz-screen').hidden=true;$('review-screen').hidden=true;$('result-screen').hidden=false;$('result-score').textContent=`${state.score.toFixed(2)} /48`;const correct=state.answers.filter((a,i)=>a.points===quizConfig.questions[i].points).length;
 $('result-summary').replaceChildren();[['Final Score',`${state.score.toFixed(2)} /48`],['Correct Answers',correct],['Wrong Answers',32-correct],['Accuracy',`${(100*state.score/48).toFixed(1)}%`],['Time Taken',fmt(timer.seconds)],['Attempts',storedResult.attempts],['Best Score',`${storedResult.best.toFixed(2)} /48`],['Total Time Taken',fmt(timer.seconds)]].forEach(([label,value])=>{const cell=el('div','result-cell');cell.append(el('span','',label),el('strong','',String(value)));$('result-summary').append(cell)});
 $('breakdown').replaceChildren();breakdown().forEach((v,name)=>{const row=el('div');row.append(el('span','',name),el('strong','',`${v.earned}/${v.total}`));$('breakdown').append(row)});
 $('result-transcript').replaceChildren(transcript());
 const remarks=['Fail','Pass','Fairly Good','Good','Very Good','Excellent!'];const final=remarks[state.score<24?0:state.score<28.8?1:state.score<33.6?2:state.score<38.4?3:state.score<43.2?4:5];let step=0;clearInterval(remarkInterval);remarkInterval=setInterval(()=>{$('remark').textContent=remarks[step++%remarks.length]},110);setTimeout(()=>{clearInterval(remarkInterval);$('remark').textContent=final},3000);sound('complete');if(state.score>=38.4)confetti()
}
function confetti(){const host=$('confetti');host.replaceChildren();host.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden';for(let i=0;i<55;i++){const piece=el('span');piece.style.cssText=`position:absolute;top:-15px;left:${Math.random()*100}%;width:8px;height:12px;background:${['#2563eb','#16a34a','#f6bc31','#ed6b78'][i%4]};transform:rotate(${Math.random()*360}deg)`;host.append(piece);piece.animate([{transform:'translateY(0) rotate(0deg)'},{transform:`translateY(${window.innerHeight+40}px) rotate(760deg)`}],{duration:2000+Math.random()*1800,delay:Math.random()*700,fill:'forwards'})}setTimeout(()=>host.replaceChildren(),4600)}
$('review-button').addEventListener('click',()=>{const list=$('review-list');list.replaceChildren();$('review-transcript').replaceChildren(transcript());quizConfig.questions.forEach((q,i)=>{const a=state.answers[i],section=el('article','review-item');section.append(el('h2','',q.taskLabel),el('h3','',`Question ${i+1}: ${q.task}`));if(q.type==='single'){section.append(el('p',a.detail.choice===q.correctAnswer?'correct':'wrong',`Your answer: ${a.detail.choice}`),el('p','',`Correct answer: ${q.correctAnswer}`))}else if(q.type==='multi'){section.append(el('p','',`Your selections: ${a.detail.selected.join('; ')}`),el('p','',`Correct selections: ${q.correctOptions.join('; ')}`))}else if(q.type==='matching'){q.rows.forEach(row=>{const chip=q.chips.find(c=>c[0]===a.detail.slots[row[0]]),expected=q.chips.find(c=>c[2]===row[0]);section.append(el('p',chip?.[0]===expected[0]?'correct':'wrong',`${row[1]} — Yours: ${chip?.[1]||'—'} | Correct: ${expected[1]}`))})}else{a.detail.order.forEach((id,position)=>{const yours=q.items.find(item=>item[0]===id),expected=q.items[position];section.append(el('p',id===expected[0]?'correct':'wrong',`${position+1}. Yours: ${yours[1]} | Correct: ${expected[1]}`))})}section.append(el('p','',`Points: ${a.points}/${q.points}`),el('p','',q.explanation));list.append(section)});$('result-screen').hidden=true;$('review-screen').hidden=false});
$('back-results').addEventListener('click',()=>{$('review-screen').hidden=true;$('result-screen').hidden=false});
$('restart-button').addEventListener('click',()=>{clearInterval(remarkInterval);state.index=0;state.answers=Array(32).fill(null);state.views=Array(32).fill(null);state.score=0;audioPlayer.reset();timer.reset();$('result-screen').hidden=true;$('review-screen').hidden=true;$('quiz-screen').hidden=false;renderQuestion();timer.start()});
$('print-button').addEventListener('click',()=>window.print());
$('save-button').addEventListener('click',()=>{const lines=['EXPRESSING CONCESSION — LISTENING - QUIZ 1',`Final Score: ${state.score.toFixed(2)} /48`,`Time Taken: ${fmt(timer.seconds)}`,'',...Array.from(breakdown(),([name,v])=>`${name}: ${v.earned}/${v.total}`),'','TRANSCRIPT',...quizConfig.transcript.map(([speaker,text])=>`${speaker}: ${text}`)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='expressing-concession-results.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)});
renderQuestion();timer.start();
</script>
