const $=id=>document.getElementById(id);
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffledNotIdentity(items){let a=shuffle(items);if(a.length>1&&a.every((x,i)=>x===items[i]))[a[0],a[1]]=[a[1],a[0]];return a}
let states=[],current=0,reviewIndex=0,mode="quiz",attempts=0,best=0,elapsed=0,timerId=null,remarkTimer=null,selectionTimer=null,audioContext=null;

/* Independent count-up timer. */
const timer={
start(){if(timerId)return;timerId=setInterval(()=>{elapsed++;$('timerStat').textContent="Timer: "+timer.format()},1000)},
pause(){clearInterval(timerId);timerId=null},
reset(){timer.pause();elapsed=0;$('timerStat').textContent="Timer: 00:00"},
format(){return String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0")}
};
function readStorage(){try{attempts=Number(localStorage.getItem("concessionAttempts"))||0;best=Number(localStorage.getItem("concessionBest"))||0}catch{}}
function writeStorage(score){try{localStorage.setItem("concessionAttempts",String(attempts));localStorage.setItem("concessionBest",String(best));localStorage.setItem("concessionLast",String(score));localStorage.setItem("concessionTime",timer.format())}catch{}}
function sound(kind){if($('muteEffects')?.checked)return;try{audioContext ||=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type="sine";o.frequency.setValueAtTime(kind==="wrong"?240:kind==="click"?470:kind==="complete"?660:520,t);o.frequency.exponentialRampToValueAtTime(kind==="wrong"?180:kind==="complete"?990:kind==="click"?420:780,t+.15);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g).connect(audioContext.destination);o.start(t);o.stop(t+.2)}catch{}}
function startState(){states=q.map(item=>({locked:false,earned:0,order:item.type==="single-choice"?shuffle(item.choices):item.type==="multi-select-exact"?shuffle(item.options):item.type==="matching"?shuffledNotIdentity(item.chips.map(c=>c.id)):item.type==="ordering"?shuffledNotIdentity(item.items.map(i=>i.id)):[],selected:[],placements:{},answer:null}))}
function phase(index){return index<6?"PRE-LISTENING":index<8?"WHILE-LISTENING — First Listening: General Understanding":index<17?"WHILE-LISTENING — Second Listening: Specific Information":index<23?"WHILE-LISTENING — Third Listening: Understanding the Function":"POST-LISTENING"}

/* The provided recording URL is a filename placeholder. Sandbox audio-file playback
   is unavailable; controls remain visibly unavailable rather than claiming to play audio. */
const audioPlayer={
show(index){$('audioPanel').hidden=index<6;if(index>=6)$('audioError').textContent="Audio couldn't be loaded — ask your teacher for the printed transcript."},
reset(){$('audioPanel').hidden=true;$('audioProgress').style.width="0%"}
};
function updateStats(){const answered=states.filter(s=>s.locked),correct=answered.filter((s,i)=>s.earned===q[states.indexOf(s)].points).length,wrong=answered.length-correct,score=answered.reduce((sum,s)=>sum+s.earned,0);$('correctStat').textContent="✅ Correct: "+correct;$('wrongStat').textContent="❌ Wrong: "+wrong;$('remainingStat').textContent="Remaining: "+(32-answered.length);$('scoreStat').textContent="Score: "+score.toFixed(2)+" /48";$('timerStat').textContent="Timer: "+timer.format();return{correct,wrong,score}}
function feedback(text){$('feedback').textContent=text;$('feedback').hidden=false}
function finish(points,answer){const s=states[current];if(s.locked)return;s.locked=true;s.earned=points;s.answer=answer;updateStats();$('next').disabled=false;sound(points===q[current].points?"correct":"wrong")}
function render(){clearTimeout(selectionTimer);mode="quiz";$('quizView').hidden=false;$('resultView').hidden=true;$('reviewView').hidden=true;const item=q[current],s=states[current];$('phaseBanner').textContent=phase(current);audioPlayer.show(current);$('taskLabel').textContent=item.taskLabel;$('instruction').textContent=item.question;$('taskText').textContent=item.task;$('counter').textContent=`${current+1} / ${q.length}`;$('previous').disabled=current===0;$('next').disabled=!s.locked;$('next').textContent=current===q.length-1?"See Results ▶":"Next ▶";$('feedback').hidden=!s.locked;if(s.locked)$('feedback').textContent=(s.earned===item.points?"Well done! ":"Keep practising! ")+item.explanation;const area=$('answerArea');area.replaceChildren();({ "single-choice":renderSingle,matching:renderMatching,"multi-select-exact":renderMulti,ordering:renderOrdering})[item.type](area,item,s);updateStats()}
function renderSingle(area,item,s){const grid=node("div","choice-grid");s.order.forEach((choice,index)=>{const button=node("button","tile",choice);button.type="button";button.dataset.choice=index;if(s.locked){button.disabled=true;button.classList.add(choice===item.correctAnswer?"correct":choice===s.answer?"wrong":"");}button.addEventListener("click",()=>{if(s.locked)return;s.answer=choice;finish(choice===item.correctAnswer?1:0,choice);grid.querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===item.correctAnswer)b.classList.add("correct");else if(b===button)b.classList.add("wrong")});feedback((s.earned?"Well done! ":"Keep practising! ")+item.explanation)});grid.append(button)});area.append(grid)}
/* TYPE D: selection is read from state on every activation; the 500 ms window
   allows a third selection to be deselected before one all-or-nothing grade. */
function renderMulti(area,item,s){const grid=node("div","choice-grid");const buttons=new Map();function paint(){buttons.forEach((b,value)=>{b.className="tile";b.disabled=s.locked;if(s.locked)b.classList.add(item.correctOptions.includes(value)?"correct":s.selected.includes(value)?"wrong":"muted");else if(s.selected.includes(value))b.classList.add("selected")})}s.order.forEach((value,index)=>{const button=node("button","tile",value);button.type="button";button.dataset.choice=index;button.addEventListener("click",()=>{if(s.locked)return;clearTimeout(selectionTimer);const selected=new Set(s.selected);selected.has(value)?selected.delete(value):selected.size<3&&selected.add(value);s.selected=[...selected];paint();sound("click");if(s.selected.length===3)selectionTimer=setTimeout(()=>{if(mode!=="quiz"||states[current]!==s||s.locked||s.selected.length!==3)return;const good=item.correctOptions.every(x=>s.selected.includes(x));finish(good?3:0,[...s.selected]);paint();feedback((good?"Well done! ":"Keep practising! ")+item.explanation)},500)});buttons.set(value,button);grid.append(button)});area.append(grid);paint()}
/* Pointer capture keeps dragging consistent on touchscreens and with a mouse. */
function pointerDrag(element,onDrop){element.addEventListener("pointerdown",event=>{if(event.button!==0||event.target.closest(".arrow-controls"))return;event.preventDefault();element.setPointerCapture(event.pointerId);const startX=event.clientX,startY=event.clientY;element.classList.add("dragging");const move=e=>{element.style.transform=`translate(${e.clientX-startX}px,${e.clientY-startY}px)`};const end=e=>{element.removeEventListener("pointermove",move);element.removeEventListener("pointerup",end);element.removeEventListener("pointercancel",cancel);element.releasePointerCapture(e.pointerId);element.style.transform="";element.classList.remove("dragging");if(e.type==="pointerup")onDrop(document.elementFromPoint(e.clientX,e.clientY),element)};const cancel=e=>{element.removeEventListener("pointermove",move);element.removeEventListener("pointerup",end);element.removeEventListener("pointercancel",cancel);element.releasePointerCapture(e.pointerId);element.style.transform="";element.classList.remove("dragging")};element.addEventListener("pointermove",move);element.addEventListener("pointerup",end);element.addEventListener("pointercancel",cancel)})}
/* TYPE C: chips may be placed, swapped and returned before the one graded check. */
function renderMatching(area,item,s){const layout=node("div","match-layout"),rows=node("div","match-rows"),tray=node("div","chip-tray"),chips=new Map(),slots=new Map();tray.dataset.tray="true";item.rows.forEach(row=>{const line=node("div","match-row"),label=node("span","",row.text),slot=node("div","slot");slot.dataset.row=row.id;line.append(label,slot);rows.append(line);slots.set(row.id,slot)});s.order.forEach(id=>{const chip=item.chips.find(c=>c.id===id),el=node("button","chip",chip.text);el.type="button";el.dataset.chip=id;chips.set(id,el);tray.append(el);if(!s.locked)pointerDrag(el,(target)=>{const destination=target?.closest("[data-row],[data-tray]");if(!destination||!layout.contains(destination))return;const from=Object.keys(s.placements).find(r=>s.placements[r]===id);if(destination.dataset.tray){if(from)delete s.placements[from]}else{const rowId=destination.dataset.row,existing=s.placements[rowId];if(from)delete s.placements[from];if(existing&&existing!==id){if(from)s.placements[from]=existing;else delete s.placements[rowId]}s.placements[rowId]=id}positionChips();sound("click")})});function positionChips(){s.order.forEach(id=>{const rowId=Object.keys(s.placements).find(r=>s.placements[r]===id);(rowId?slots.get(rowId):tray).append(chips.get(id))});check.hidden=s.locked||Object.keys(s.placements).length!==item.rows.length;if(s.locked)item.rows.forEach(row=>{const slot=slots.get(row.id),placed=item.chips.find(c=>c.id===s.placements[row.id]);slot.classList.add(placed?.matchesRowId===row.id?"correct":"wrong");if(placed?.matchesRowId!==row.id)slot.append(node("small","block ml-2","Correct: "+item.chips.find(c=>c.matchesRowId===row.id).text))})}const check=node("button","primary mt-4","Check Answers");check.type="button";check.addEventListener("click",()=>{if(s.locked||Object.keys(s.placements).length!==item.rows.length)return;const count=item.rows.filter(row=>item.chips.find(c=>c.id===s.placements[row.id])?.matchesRowId===row.id).length;finish(count,{...s.placements});positionChips();feedback(`${count} of ${item.points} pairs correct. ${item.explanation}`)});layout.append(rows,tray);area.append(layout,check);positionChips()}
/* TYPE E: dragging and arrow buttons mutate the same order; checking grades
   each current position without changing the student's displayed order. */
function renderOrdering(area,item,s){const list=node("div","order-list"),check=node("button","primary mt-4","Check Answers");function paint(){list.replaceChildren();s.order.forEach((id,index)=>{const value=item.items.find(x=>x.id===id),row=node("div","order-item");row.dataset.item=id;if(s.locked)row.classList.add(value.correctPosition===index+1?"correct":"wrong");row.append(node("span","order-text",value.text));if(!s.locked){const controls=node("div","arrow-controls");["▲","▼"].forEach((text,offset)=>{const b=node("button","",text);b.type="button";b.setAttribute("aria-label",text==="▲"?"Move up":"Move down");b.disabled=offset===0?index===0:index===s.order.length-1;b.addEventListener("click",()=>{const next=index+(offset===0?-1:1);[s.order[index],s.order[next]]=[s.order[next],s.order[index]];paint();sound("click")});controls.append(b)});row.append(controls);pointerDrag(row,target=>{const hit=target?.closest("[data-item]");if(!hit||!list.contains(hit)||hit.dataset.item===id)return;const from=s.order.indexOf(id),to=s.order.indexOf(hit.dataset.item);s.order.splice(from,1);s.order.splice(to,0,id);paint();sound("click")})}list.append(row)})}check.type="button";check.hidden=s.locked;check.addEventListener("click",()=>{if(s.locked)return;const points=s.order.filter((id,i)=>item.items.find(x=>x.id===id).correctPosition===i+1).length;finish(points,[...s.order]);paint();check.hidden=true;const correct=node("div","feedback","Correct order: "+[...item.items].sort((a,b)=>a.correctPosition-b.correctPosition).map(x=>x.text).join(" → "));area.append(correct);feedback(`${points} of 5 positions correct. ${item.explanation}`)});area.append(list,check);paint();if(s.locked)area.append(node("div","feedback","Correct order: "+[...item.items].sort((a,b)=>a.correctPosition-b.correctPosition).map(x=>x.text).join(" → ")))}
function buildTranscript(){document.querySelectorAll(".transcript-content").forEach(container=>{container.replaceChildren();quizConfig.audioTranscript.forEach(([speaker,text])=>{const p=node("p");p.append(node("strong","",speaker+": "),document.createTextNode(text));container.append(p)})})}
function remarkFor(score){return score<24?"Fail":score<28.8?"Pass":score<33.6?"Fairly Good":score<38.4?"Good":score<43.2?"Very Good":"Excellent!"}
function showResults(){timer.pause();mode="result";$('quizView').hidden=true;$('reviewView').hidden=true;$('resultView').hidden=false;const stats=updateStats();$('finalScore').textContent=stats.score.toFixed(2);attempts++;best=Math.max(best,stats.score);writeStorage(stats.score);const summary=[["Final Score",stats.score.toFixed(2)+" /48"],["Correct Answers",stats.correct],["Wrong Answers",stats.wrong],["Accuracy",((stats.score/48)*100).toFixed(1)+"%"],["Time Taken",timer.format()],["Attempts",attempts],["Best Score",best.toFixed(2)+" /48"]];$('summaryGrid').replaceChildren(...summary.map(([label,value])=>{const el=node("div","summary-cell");el.append(node("span","",label),node("strong","",String(value)));return el}));$('breakdown').replaceChildren(...Object.values(T).map(label=>{const items=q.map((x,i)=>({x,i})).filter(({x})=>x.taskLabel===label),earned=items.reduce((a,{i})=>a+states[i].earned,0),total=items.reduce((a,{x})=>a+x.points,0),li=node("li");li.append(node("span","",label),node("strong","",earned+"/"+total));return li}));$('resultTranscript').open=false;const remarks=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let step=0;clearTimeout(remarkTimer);function cycle(){if(mode!=="result")return;$('remark').textContent=remarks[step%remarks.length];step++;if(step<20)remarkTimer=setTimeout(cycle,65+step*9);else $('remark').textContent=remarkFor(stats.score)}cycle();if(stats.score>=38.4)confetti()}
function confetti(){for(let i=0;i<55;i++){const piece=node("i","confetti");piece.style.left=Math.random()*100+"%";piece.style.background=["#2563eb","#16a34a","#f59e0b","#ef4444"][i%4];piece.style.animationDelay=Math.random()*1.2+"s";document.body.append(piece);setTimeout(()=>piece.remove(),4500)}}
function renderReview(){mode="review";$('quizView').hidden=true;$('resultView').hidden=true;$('reviewView').hidden=false;const item=q[reviewIndex],s=states[reviewIndex],box=$('reviewContent');box.replaceChildren(node("p","task-label",item.taskLabel),node("h2","instruction",item.question),node("p","task",item.task));function line(text,correct){box.append(node("div","review-line "+(correct?"correct":"wrong"),text))}
if(item.type==="single-choice"){line("Student Answer: "+s.answer,s.answer===item.correctAnswer);line("Correct Answer: "+item.correctAnswer,true)}
else if(item.type==="multi-select-exact"){line("Student selections: "+s.answer.join("; "),s.earned===3);line("Correct selections: "+item.correctOptions.join("; "),true)}
else if(item.type==="matching"){item.rows.forEach(row=>{const actual=item.chips.find(c=>c.id===s.answer[row.id]),correct=item.chips.find(c=>c.matchesRowId===row.id);line(row.text+" — Yours: "+(actual?.text||"None")+" | Correct: "+correct.text,actual?.id===correct.id)})}
else{s.answer.forEach((id,i)=>{const actual=item.items.find(x=>x.id===id),expected=item.items.find(x=>x.correctPosition===i+1);line((i+1)+". Yours: "+actual.text+" | Correct: "+expected.text,actual.id===expected.id)})}
box.append(node("div","feedback",item.explanation));$('reviewCounter').textContent=`${reviewIndex+1} / ${q.length}`;$('reviewPrevious').disabled=reviewIndex===0;$('reviewNext').disabled=reviewIndex===q.length-1}
function restart(){clearTimeout(remarkTimer);clearTimeout(selectionTimer);document.querySelectorAll(".confetti").forEach(x=>x.remove());timer.reset();audioPlayer.reset();startState();current=0;reviewIndex=0;render();timer.start()}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function saveReport(){const stats=updateStats(),rows=Object.values(T).map(label=>{const indexes=q.map((x,i)=>x.taskLabel===label?i:-1).filter(i=>i>=0);return `<li>${escapeHtml(label)}: ${indexes.reduce((n,i)=>n+states[i].earned,0)}/${indexes.reduce((n,i)=>n+q[i].points,0)}</li>`}).join("");const transcript=quizConfig.audioTranscript.map(([speaker,text])=>`<p><b>${escapeHtml(speaker)}:</b> ${escapeHtml(text)}</p>`).join("");const html=`<!doctype html><html lang="en"><meta charset="utf-8"><title>Quiz results</title><body style="font:16px sans-serif;max-width:850px;margin:32px auto"><h1>English2BAC Quizzes</h1><p>UNIT: 5 · EXPRESSING CONCESSION · LISTENING - QUIZ 1</p><h2>Final Score: ${stats.score.toFixed(2)} /48 — ${escapeHtml(remarkFor(stats.score))}</h2><p>Correct: ${stats.correct} · Wrong: ${stats.wrong} · Accuracy: ${((stats.score/48)*100).toFixed(1)}% · Time: ${timer.format()} · Attempts: ${attempts} · Best: ${best.toFixed(2)} /48</p><h2>Per-task breakdown</h2><ul>${rows}</ul><h2>Transcript</h2>${transcript}</body></html>`;const blob=new Blob([html],{type:"text/html"}),url=URL.createObjectURL(blob),a=node("a");a.href=url;a.download="expressing-concession-results.html";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('previous').addEventListener("click",()=>{if(current>0){current--;render()}});
$('next').addEventListener("click",()=>{if(!states[current].locked)return;if(current===q.length-1)showResults();else{current++;render()}});
$('reviewButton').addEventListener("click",()=>{reviewIndex=0;$('reviewTranscript').open=false;renderReview()});
$('reviewPrevious').addEventListener("click",()=>{if(reviewIndex>0){reviewIndex--;renderReview()}});
$('reviewNext').addEventListener("click",()=>{if(reviewIndex<q.length-1){reviewIndex++;renderReview()}});
$('backResults').addEventListener("click",()=>{mode="result";$('reviewView').hidden=true;$('resultView').hidden=false});
$('restartButton').addEventListener("click",restart);

document.addEventListener("keydown",event=>{if(event.altKey||event.ctrlKey||event.metaKey||["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;if(document.activeElement.closest("#audioControls"))return;if(mode==="quiz"){if(/^[1-6]$/.test(event.key)){const button=$('answerArea').querySelector(`.tile[data-choice="${Number(event.key)-1}"]`);if(button&&!button.disabled){event.preventDefault();button.click()}}else if(event.key==="ArrowLeft"){event.preventDefault();$('previous').click()}else if(event.key==="ArrowRight"){event.preventDefault();$('next').click()}else if(event.key==="Enter"&&document.activeElement===document.body){const check=$('answerArea').querySelector(".primary");if(check&&!check.hidden)check.click();else $('next').click()}}else if(mode==="review"){if(event.key==="ArrowLeft")$('reviewPrevious').click();if(event.key==="ArrowRight")$('reviewNext').click()}});
buildTranscript();readStorage();restart();
