  <script>
    /* Quiz configuration and question bank */
    const quizConfig = {
      unit:"UNIT 5",title:"WOMEN AND POWER",lesson:"VOCABULARY - QUIZ 2",teacherName:"Teacher Soufiane",
      teacherImage:"https://i.imgur.com/vvyZAnr.png",logo:"https://imgur.com/XPOYllA",
      randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true,
      questions:[
        {type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"The act of guiding or directing a group.",choices:["leadership","violence","working women","feminism"],correctAnswer:"leadership",explanation:"Leadership is the act of guiding or directing a group of people toward a goal.",points:1},
        {type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"Hurting someone physically.",choices:["violence","leadership","working women","feminism"],correctAnswer:"violence",explanation:"Violence refers to behavior involving physical force intended to hurt someone.",points:1},
        {type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"Women who have jobs and earn money.",choices:["working women","leadership","violence","feminism"],correctAnswer:"working women",explanation:"Working women refers to women who are employed and earn an income.",points:1},
        {type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"The belief that men and women should have the same rights and opportunities.",choices:["feminism","leadership","violence","working women"],correctAnswer:"feminism",explanation:"Feminism is the belief and movement advocating that men and women should have equal rights and opportunities.",points:1},
        {type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"The form is ______ because you forgot to fill out your name. (complete)",choices:["incomplete","complete","completely","completion"],correctAnswer:"incomplete",explanation:"We add the prefix 'in-' to 'complete' to form its opposite, 'incomplete'.",points:1},
        {type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"After his injury, he became ______ and stayed home a lot. (active)",choices:["inactive","active","actively","inactivity"],correctAnswer:"inactive",explanation:"We add the prefix 'in-' to 'active' to form its opposite, 'inactive'.",points:1},
        {type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"She felt ______ when she lost her favorite toy. (happy)",choices:["unhappy","happy","happily","unhappiness"],correctAnswer:"unhappy",explanation:"We add the prefix 'un-' to 'happy' to form its opposite, 'unhappy'.",points:1},
        {type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"The law aims to ______ opportunities for all citizens. (equal)",choices:["equalize","equal","equality","unequal"],correctAnswer:"equalize",explanation:"The verb 'equalize' means to make opportunities equal for everyone.",points:1},
        {type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"The ______ of women has been a long and challenging journey, marked by struggles for equal rights and opportunities.",choices:["emancipation","working woman","freedom","woman"],correctAnswer:"emancipation",explanation:"'Emancipation' fits because it refers to the process of being set free from restrictions or unfair treatment.",points:1},
        {type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"A ______ often faces challenges in balancing her career and family responsibilities.",choices:["working woman","emancipation","freedom","woman"],correctAnswer:"working woman",explanation:"'Working woman' fits because the sentence discusses balancing a career and family responsibilities.",points:1},
        {type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"Every ______ deserves the right to live without fear and pursue her dreams.",choices:["woman","working woman","emancipation","freedom"],correctAnswer:"woman",explanation:"'Woman' fits because the sentence discusses an individual's right to live without fear.",points:1},
        {type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"Regardless of their color or religion, people must have ______.",choices:["freedom","woman","working woman","emancipation"],correctAnswer:"freedom",explanation:"'Freedom' fits because the sentence discusses a right that should apply to everyone equally.",points:1},
        {type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"Her opinion tends to ______ from her sister's on most political issues.",choices:["differ","treat","relate","empower"],correctAnswer:"differ",explanation:"'Differ from' is the correct natural collocation meaning to be unlike something else.",points:1},
        {type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"Doctors should give every patient the same ______ regardless of their background.",choices:["treatment","difference","relation","friendship"],correctAnswer:"treatment",explanation:"'Give treatment' is the correct natural collocation meaning to provide medical care.",points:1},
        {type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"The two events are closely ______ to the growth of the feminist movement.",choices:["related","differed","treated","empowered"],correctAnswer:"related",explanation:"'Related to' is the correct natural collocation meaning connected to something.",points:1},
        {type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"True equality can only be ______ through education and awareness.",choices:["achieved","treated","related","differed"],correctAnswer:"achieved",explanation:"'Achieve equality' is the correct natural collocation meaning to successfully attain fair treatment for all.",points:1},
        {type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"INJUSTICE",options:["unfairness","inequality","prejudice","justice"],correctSynonyms:["unfairness","inequality","prejudice"],antonym:"justice",explanation:"'Unfairness', 'inequality', and 'prejudice' all describe unfair treatment, like 'injustice'. 'Justice' means the opposite — fair and rightful treatment.",points:1},
        {type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"DISCRIMINATION",options:["bias","favoritism","intolerance","fairness"],correctSynonyms:["bias","favoritism","intolerance"],antonym:"fairness",explanation:"'Bias', 'favoritism', and 'intolerance' all describe treating people unfairly based on differences, like 'discrimination'. 'Fairness' means the opposite — equal and just treatment.",points:1},
        {type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"IMPORTANT",options:["significant","crucial","essential","trivial"],correctSynonyms:["significant","crucial","essential"],antonym:"trivial",explanation:"'Significant', 'crucial', and 'essential' all describe something of great value or necessity, like 'important'. 'Trivial' means the opposite — of little importance.",points:1},

    function remark(value){if(value<10)return"Fail";if(value<12)return"Pass";if(value<14)return"Fairly Good";if(value<16)return"Good";if(value<18)return"Very Good";return"Excellent!"}
    function breakdown(){return Array.from({length:5},(_,i)=>questions.slice(i*4,i*4+4).filter((_,j)=>answers[i*4+j]?.correct).length)}

      const total=score(),attempts=Number(localStorage.getItem("womenPowerAttempts")||0)+1,best=Math.max(total,Number(localStorage.getItem("womenPowerBestScore")||0));

      const right=total,wrong=20-right,accuracy=(right/20*100).toFixed(2),cards=[["Final Score",total.toFixed(2)+" /20"],["Correct Answers",right],["Wrong Answers",wrong],["Accuracy",accuracy+"%"],["Time Taken",timer.format()],["Number of Attempts",attempts],["Best Score",best.toFixed(2)+" /20"]];
      $("summaryGrid").innerHTML=cards.map(c=>'<div class="summary-card"><span>'+c[0]+"</span><strong>"+c[1]+"</strong></div>").join("");
      $("breakdownList").innerHTML=breakdown().map((v,i)=>'<div class="breakdown-row"><span>'+categoryNames[i]+"</span><strong>"+v+"/4</strong></div>").join("");

    }
    function renderReview(){

          if(q.type==="single-choice")card.innerHTML="<p><strong>Question "+(i+1)+":</strong> "+q.task+"</p><p>Student Answer: <span class='"+(a.correct?"answer-good":"answer-bad")+"'>"+a.selected+"</span></p><p>Correct Answer: <span class='answer-good'>"+q.correctAnswer+"</span></p><p><strong>Explanation:</strong> "+q.explanation+"</p>";

    }

<script>(function(){
var norm=function(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()};
function bigs(){var out=[],all=document.querySelectorAll("[id]");for(var i=0;i<all.length;i++){var e=all[i];if(/instruction|questiontitle|questionheading/i.test(e.id)&&!e.children.length&&norm(e.textContent))out.push(e)}return out}
function sweep(){var b=bigs();var els=document.querySelectorAll("body *");
for(var i=0;i<els.length;i++){var e=els[i];if(e.children.length||/^(SCRIPT|STYLE|BUTTON|OPTION)$/.test(e.tagName)||b.indexOf(e)>-1)continue;

if(dup){e.style.display="none";e.setAttribute("data-dup","1")}
else if(e.getAttribute("data-dup")){e.style.display="";e.removeAttribute("data-dup")}}}
var timer=null;function later(){clearTimeout(timer);timer=setTimeout(sweep,0)}
function start(){sweep();try{new MutationObserver(later).observe(document.body,{childList:true,characterData:true,subtree:true})}catch(e){}}
