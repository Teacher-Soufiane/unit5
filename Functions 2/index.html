  <style>
    :root{--navy:#123c6b;--blue:#2563eb;--light:#eaf4ff;--green:#15803d;--red:#dc2626;--gray:#f1f5f9}

    button{font:inherit} button:focus-visible,.tile:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}
    .quiz-header{background-color:#eaf4ff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid #cfe0f2}

    .quiz-shell{width:100%;max-width:1080px;margin:0 auto;padding:22px}.instruction{background:var(--navy);color:#fff;border-radius:14px;padding:17px 22px;font-size:17px;font-weight:800;letter-spacing:.02em;box-shadow:0 8px 18px #123c6b2b}.task-card{margin-top:18px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 25px #18324b12}.task-text{font-size:18px;line-height:1.7;font-weight:600}
    .choices{display:grid;gap:12px;margin-top:20px}.choice{width:100%;text-align:left;background:#fff;border:2px solid #d7e2ee;border-radius:12px;padding:15px 18px;color:#18324b;cursor:pointer;transition:.2s;font-size:15px}.choice:hover:not(:disabled){border-color:#60a5fa;background:#f0f7ff}.choice.selected{border-color:var(--blue);background:#dbeafe}.choice.correct{border-color:var(--green);background:#dcfce7;color:#14532d}.choice.wrong{border-color:var(--red);background:#fee2e2;color:#7f1d1d}.choice:disabled{cursor:default}
    .check-btn,.nav-btn,.action-btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;transition:.2s}.check-btn{margin-top:16px;background:var(--blue);color:#fff}.check-btn:disabled,.nav-btn:disabled{opacity:.45;cursor:not-allowed}.nav-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:18px}.nav-btn{background:var(--navy);color:#fff}.nav-btn:last-child{justify-self:end}.counter{font-weight:800;color:#31516f}.stats{margin-top:13px;padding:12px 16px;background:#fff;border-radius:11px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;box-shadow:0 4px 14px #18324b0d;font-size:14px;font-weight:700}.feedback{margin-top:17px;padding:14px 16px;border-radius:10px;background:#eff6ff;color:#1e40af;font-weight:600}.explanation{margin-top:10px;line-height:1.6;font-size:14px;color:#38536d}
    .tile-pool{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.tile{border:2px solid #93c5fd;background:#eff6ff;color:#1e3a5f;border-radius:9px;padding:10px 14px;cursor:grab;font-weight:700}.tile.selected-tile{outline:3px solid var(--blue);background:#dbeafe}.tile.graded-good{border-color:var(--green);background:#dcfce7}.tile.graded-bad{border-color:var(--red);background:#fee2e2}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop-column{min-height:170px;padding:14px;border:2px dashed #93c5fd;border-radius:14px;background:#f8fbff}.drop-column.over{background:#dbeafe}.column-title{text-align:center;font-weight:800;color:var(--navy);margin-bottom:12px}.correct-note{display:block;color:#b91c1c;font-size:11px;margin-top:4px}
    .chat{display:grid;gap:13px;margin-top:8px}.bubble{max-width:78%;padding:13px 16px;border-radius:17px;line-height:1.55}.bubble.a{justify-self:start;background:#e0f2fe;border-bottom-left-radius:4px}.bubble.b{justify-self:end;background:#f3e8ff;border-bottom-right-radius:4px}.function-tag{display:inline-block;margin-top:14px;background:#dbeafe;color:#1e40af;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:800}
    .result{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #18324b12;text-align:center}.score-badge{width:180px;height:180px;border-radius:50%;margin:22px auto;display:grid;place-items:center;background:var(--navy);color:#fff;border:9px solid #bfdbfe;font-size:28px;font-weight:800}.remark{font-size:31px;font-weight:800;color:var(--navy);min-height:48px}.summary{max-width:640px;margin:22px auto;text-align:left;background:#f8fbff;padding:18px;border-radius:12px;line-height:1.9}.breakdown{text-align:left;margin-top:18px}.breakdown div{padding:8px;border-bottom:1px solid #e5edf5}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.action-btn{background:var(--blue);color:#fff}.action-btn.secondary{background:#e2e8f0;color:#18324b}.review-item{text-align:left;margin:16px 0;padding:18px;background:#fff;border-radius:13px;box-shadow:0 4px 14px #18324b10}.review-item h3{margin:0 0 10px;color:var(--navy)}.confetti{position:fixed;width:10px;height:10px;top:-12px;z-index:20;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(1100px) rotate(720deg);opacity:0}}
    @media(min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}@media(min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}@media(max-width:640px){.header-teacher-img,.header-logo-img{height:45px}.quiz-header{padding:8px 12px;gap:8px}.title-line1{font-size:16px}.title-line2{font-size:12px}.title-line3{font-size:10px}.info-bar{padding:9px 12px;font-size:9px}.quiz-shell{padding:14px}.instruction{font-size:14px;padding:14px}.task-card{padding:17px}.task-text{font-size:16px}.columns{grid-template-columns:1fr}.stats{justify-content:flex-start;gap:9px;font-size:12px}.bubble{max-width:92%}}

 <body>
  <header class="quiz-header"><img class="header-teacher-img" loading="lazy" src="teacher.png" alt="Teacher Soufiane">
   <div class="header-title">
    <div class="title-line1">

  <section class="info-bar" aria-label="Quiz information"><span>UNIT: 5</span><span>EXPRESSING ADDITION &amp; CONCESSION</span><span>FUNCTIONS - QUIZ 2</span>
  </section>
  <main class="quiz-shell" id="app" aria-live="polite"></main>
  <script>
    const quizConfig={unit:"5",title:"EXPRESSING ADDITION & CONCESSION",lesson:"FUNCTIONS - QUIZ 2",questions:[
      {type:"drag-classify",category:"Classify the Connectors",question:"CLASSIFY THE CONNECTORS INTO THE CORRECT CATEGORY.",columns:["Expressing Addition","Expressing Concession"],tiles:[["t1","also","Expressing Addition"],["t2","moreover","Expressing Addition"],["t3","in addition","Expressing Addition"],["t4","as well","Expressing Addition"],["t5","although","Expressing Concession"],["t6","despite","Expressing Concession"],["t7","however","Expressing Concession"],["t8","even though","Expressing Concession"],["t9","in spite of","Expressing Concession"]],explanation:"'Also', 'moreover', 'in addition', and 'as well' add extra information. 'Although', 'even though', and 'though' are followed by a full clause (subject + verb). 'Despite' and 'in spite of' are followed by a noun, noun phrase, or gerund (-ing form). 'However' introduces contrast.",points:5},
      {type:"single-choice",category:"Identify the Function: Sara",question:"WHAT FUNCTION DOES THE UNDERLINED EXPRESSION SERVE?",task:"Sara speaks English fluently. Moreover, she speaks French.",choices:["Expressing purpose","Expressing addition","Expressing cause","Expressing concession"],correctAnswer:"Expressing addition",explanation:"'Moreover' adds an extra piece of information, so it expresses addition.",points:1},
      {type:"single-choice",category:"Identify the Function: exam",question:"WHAT FUNCTION DOES THE SENTENCE EXPRESS?",task:"Although the exam was difficult, most students passed it.",choices:["Addition","Cause","Concession","Purpose"],correctAnswer:"Concession",explanation:"'Although' introduces a contrast, so it expresses concession.",points:1},
      {type:"single-choice",category:"Choose the Logical Connection: Youssef",question:"CHOOSE THE SENTENCE THAT CORRECTLY ADDS INFORMATION.",task:"Youssef is good at mathematics. ______, he is excellent at physics.",choices:["However","In addition","Although","Despite"],correctAnswer:"In addition",explanation:"'In addition' adds a second positive fact.",points:1},
      {type:"single-choice",category:"Choose the Logical Connection: Amine",question:"CHOOSE THE SENTENCE THAT CORRECTLY EXPRESSES CONCESSION.",task:"______ being very tired, Amine continued working.",choices:["In addition to","Moreover","Despite","Also"],correctAnswer:"Despite",explanation:"'Despite' is followed by a noun, noun phrase, or gerund (-ing form) to express concession." ,points:1},
      {type:"single-choice",category:"Choose the Best Connector: sister",question:"COMPLETE THE SENTENCE.",task:"My sister enjoys reading. She ______ likes writing stories.",choices:["also","although","despite","however"],correctAnswer:"also",explanation:"'Also' adds a second liked activity.",points:1},
      {type:"single-choice",category:"Choose the Best Connector: school trip",question:"CHOOSE THE CORRECT CONNECTOR.",task:"______ the bad weather, the students went on their school trip.",choices:["Although","Despite","Moreover","Also"],correctAnswer:"Despite",explanation:"'Despite' is followed directly by a noun phrase.",points:1},
      {type:"single-choice",category:"Choose the Best Connector: experience",question:"CHOOSE THE BEST OPTION.",task:"______ he was young, he had a lot of experience.",choices:["Despite","In addition to","Although","Moreover"],correctAnswer:"Although",explanation:"'Although' is followed by a full clause: a subject + a verb. The same rule applies to 'even though' and 'though'.",points:1},
      {type:"complete-exchange",category:"Complete the Exchange: new school",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:["What do you like about your new school?","..."],choices:["The teachers are helpful. In addition, the school has excellent facilities.","The teachers are helpful. However, the school has excellent facilities.","The teachers are helpful. Although, the school has excellent facilities.","The teachers are helpful. Despite, the school has excellent facilities."],correctAnswer:"The teachers are helpful. In addition, the school has excellent facilities.",function:"Expressing Addition",explanation:"Both facts are positive, so 'in addition' correctly adds the second point.",points:1},
      {type:"complete-exchange",category:"Complete the Exchange: the trip",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:["Did you enjoy the trip?","..."],choices:["Yes. Despite the long journey, I really enjoyed it.","Yes. Moreover the long journey, I really enjoyed it.","Yes. Also the long journey, I really enjoyed it.","Yes. In addition the long journey, I really enjoyed it."],correctAnswer:"Yes. Despite the long journey, I really enjoyed it.",function:"Expressing Concession",explanation:"'Despite' introduces the contrast and is followed by the noun phrase 'the long journey'.",points:1},
      {type:"complete-exchange",category:"Complete the Exchange: the job",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:["Was the job difficult?","..."],choices:["Yes, it was difficult. However, I managed to finish it on time.","Yes, it was difficult. In addition, I managed to finish it on time.","Yes, it was difficult. Also, I managed to finish it on time.","Yes, it was difficult. As well as, I managed to finish it on time."],correctAnswer:"Yes, it was difficult. However, I managed to finish it on time.",function:"Expressing Concession",explanation:"'However' introduces the contrast between difficulty and finishing on time.",points:1},
      {type:"single-choice",category:"Situation → Best Expression: new phone",question:"WHICH SENTENCE IS BEST?",task:"You want to tell your friend that your new phone is cheap AND has a good camera.",choices:["My new phone is cheap. In addition, it has a good camera.","My new phone is cheap. Although, it has a good camera.","My new phone is cheap. Despite, it has a good camera.","My new phone is cheap. However, it has a good camera."],correctAnswer:"My new phone is cheap. In addition, it has a good camera.",explanation:"Both facts are positive selling points, so 'in addition' fits.",points:1},
      {type:"single-choice",category:"Situation → Best Expression: tired student",question:"WHICH SENTENCE IS CORRECT?",task:"You want to say that a student was tired but continued studying.",choices:["Despite he was tired, he continued studying.","Although being tired, he continued studying.","Although he was tired, he continued studying.","Moreover he was tired, he continued studying."],correctAnswer:"Although he was tired, he continued studying.",explanation:"'Although' is followed by a full clause.",points:1},
      {type:"single-choice",category:"Same Meaning: restaurant",question:"CHOOSE THE SENTENCE WITH THE SAME MEANING.",task:"Although the restaurant was expensive, we enjoyed the meal.",choices:["We enjoyed the meal despite the restaurant being expensive.","We enjoyed the meal because the restaurant was expensive.","We enjoyed the meal in addition to the restaurant being expensive.","We enjoyed the meal so the restaurant was expensive."],correctAnswer:"We enjoyed the meal despite the restaurant being expensive.",explanation:"'Despite' + -ing keeps the same contrast meaning.",points:1},
      {type:"single-choice",category:"Same Meaning: Fatima",question:"CHOOSE THE SENTENCE WITH THE SAME MEANING.",task:"Fatima speaks Arabic and French. She also speaks English.",choices:["Fatima speaks Arabic and French, although she speaks English.","Fatima speaks Arabic and French as well as English.","Fatima speaks Arabic and French despite English.","Fatima speaks Arabic and French instead of English."],correctAnswer:"Fatima speaks Arabic and French as well as English.",explanation:"'As well as' keeps the addition meaning of 'also'.",points:1},
      {type:"single-choice",category:"Final Challenge: Amina",question:"WHICH SENTENCE BEST EXPRESSES THE RELATIONSHIP BETWEEN HER SITUATION AND HER DECISION?",task:"Amina wanted to study abroad. She had excellent grades, but her family could not afford the cost. She decided to apply for a scholarship.",choices:["Although her family could not afford the cost, Amina decided to apply for a scholarship.","In addition, her family could not afford the cost, Amina decided to apply for a scholarship.","Despite her family could not afford the cost, Amina decided to apply for a scholarship.","Moreover her family could not afford the cost, Amina decided to apply for a scholarship."],correctAnswer:"Although her family could not afford the cost, Amina decided to apply for a scholarship.",explanation:"'Although' is correctly followed by a full clause and expresses contrast.",points:1}
    ]};

    const app=document.getElementById("app");
    let index=0,score=0,correct=0,wrong=0,selectedTile=null;
    const answers=quizConfig.questions.map(()=>({locked:false,score:0,selected:null,placements:{}}));

    /* Timer module operates independently from rendering. */
    const timer={seconds:0,id:null,start(){if(!this.id)this.id=setInterval(()=>{this.seconds++;updateStats()},1000)},pause(){clearInterval(this.id);this.id=null},reset(){this.pause();this.seconds=0},format(){return String(Math.floor(this.seconds/60)).padStart(2,"0")+":"+String(this.seconds%60).padStart(2,"0")}};

    function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function orderFor(q,key,list){if(!q[key])q[key]=shuffle(list);return q[key]}
    function sound(kind){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=kind==="good"?660:kind==="bad"?190:430;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
    function feedback(ok){return ok?["Excellent!","Great Job!","Perfect!","Keep Going!"][Math.floor(Math.random()*4)]:["Almost!","Review this rule.","Keep learning!","You'll get the next one!"][Math.floor(Math.random()*4)]}
    function scoreText(n){return n.toFixed(2)}
    function updateStats(){const remaining=quizConfig.questions.length-correct-wrong;const s=document.getElementById("stats");if(s)s.innerHTML=`<span>✅ Correct: ${correct}</span><span>❌ Wrong: ${wrong}</span><span>Remaining: ${remaining}</span><span>Score: ${scoreText(score)} /20</span><span>Timer ${timer.format()}</span>`}

    function shell(q,inside){
      app.innerHTML=`<section class="instruction">${q.question}</section><section class="task-card">${inside}</section>
      <div class="nav-row"><button id="prev" class="nav-btn" ${index===0?"disabled":""}>◀ Previous</button><div class="counter">${index+1} / 16</div><button id="next" class="nav-btn" ${!answers[index].locked?"disabled":""}>Next ▶</button></div>
      <div class="stats" id="stats"></div>`;
      document.getElementById("prev").onclick=()=>{index--;renderQuestion()};
      document.getElementById("next").onclick=()=>{if(index===15)showResults();else{index++;renderQuestion()}};
      updateStats();
    }

    /* Type A: cached tile order and dynamic q.points / q.tiles.length scoring. */
    function renderDrag(q,state){
      const tiles=q.tiles.map(t=>({id:t[0],text:t[1],correctColumn:t[2]})); const ordered=orderFor(q,"_tileOrder",tiles);
      let pool=ordered.filter(t=>!state.placements[t.id]), cols=q.columns.map(c=>tiles.filter(t=>state.placements[t.id]===c));
      const tileHTML=t=>{const graded=state.locked?(state.placements[t.id]===t.correctColumn?"graded-good":"graded-bad"):"";return `<button class="tile ${graded}" draggable="${!state.locked}" data-id="${t.id}">${t.text}${state.locked&&state.placements[t.id]!==t.correctColumn?`<small class="correct-note">Correct: ${t.correctColumn}</small>`:""}</button>`};
      let html=`<div class="task-text">Drag or tap a connector, then choose its category.</div><div class="tile-pool" id="pool">${pool.map(tileHTML).join("")}</div><div class="columns">${q.columns.map((c,i)=>`<section class="drop-column" data-column="${c}" tabindex="0"><div class="column-title">${c}</div><div class="placed">${cols[i].map(tileHTML).join("")}</div></section>`).join("")}</div>`;
      if(!state.locked)html+=`<button class="check-btn" id="check" ${Object.keys(state.placements).length!==tiles.length?"disabled":""}>Check Answers</button>`;
      if(state.locked)html+=`<div class="feedback">${feedback(state.score>0)}<div class="explanation">${q.explanation}</div></div>`;
      shell(q,html);

      document.querySelectorAll(".tile").forEach(el=>{
        el.addEventListener("click",()=>{if(state.locked)return;selectedTile=el.dataset.id;document.querySelectorAll(".tile").forEach(x=>x.classList.toggle("selected-tile",x.dataset.id===selectedTile));sound("click")});
        el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",el.dataset.id);selectedTile=el.dataset.id;sound("click")});
      });
      document.querySelectorAll(".drop-column").forEach(col=>{
        col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});
        col.addEventListener("dragleave",()=>col.classList.remove("over"));
        col.addEventListener("drop",e=>{e.preventDefault();placeTile(e.dataTransfer.getData("text/plain"),col.dataset.column)});
        col.addEventListener("click",()=>{if(selectedTile)placeTile(selectedTile,col.dataset.column)});
        col.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selectedTile){e.preventDefault();placeTile(selectedTile,col.dataset.column)}})
      });
      function placeTile(id,column){if(!id||state.locked)return;state.placements[id]=column;selectedTile=null;sound("click");renderQuestion()}
      const check=document.getElementById("check");if(check)check.onclick=()=>{let earned=0;tiles.forEach(t=>{if(state.placements[t.id]===t.correctColumn)earned+=q.points/q.tiles.length});state.score=earned;state.locked=true;score+=earned;if(earned===q.points)correct++;else wrong++;sound(earned>0?"good":"bad");renderQuestion()};
    }

    function renderSingle(q,state){
      const choices=orderFor(q,"_choiceOrder",q.choices);
      let html=`<div class="task-text">${q.task}</div><div class="choices">${choices.map((c,i)=>{let cls="";if(state.locked){if(c===q.correctAnswer)cls="correct";else if(c===state.selected)cls="wrong"}return `<button class="choice ${cls}" data-choice="${encodeURIComponent(c)}" ${state.locked?"disabled":""}><b>${i+1}.</b> ${c}</button>`}).join("")}</div>`;
      if(state.locked)html+=`<div class="feedback">${feedback(state.score>0)}<div class="explanation">${q.explanation}</div></div>`;
      shell(q,html);
      document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{if(state.locked)return;const picked=decodeURIComponent(btn.dataset.choice);state.selected=picked;state.locked=true;state.score=picked===q.correctAnswer?q.points:0;score+=state.score;state.score?correct++:wrong++;sound(state.score?"good":"bad");renderQuestion()});
      keyboardChoices(q,state,false);
    }

    /* Type E keeps selection blue until Check Answer, then completes the missing bubble. */
    function renderExchange(q,state){
      const choices=orderFor(q,"_choiceOrder",q.choices), display=state.locked?(state.score?state.selected:q.correctAnswer):"...";
      let html=`<div class="chat"><div class="bubble a"><b>A</b><br>${q.dialogue[0]}</div><div class="bubble b"><b>B</b><br>${display}</div></div><div class="choices">${choices.map((c,i)=>{let cls=state.selected===c?"selected":"";if(state.locked){if(c===q.correctAnswer)cls="correct";else if(c===state.selected)cls="wrong"}return `<button class="choice ${cls}" data-choice="${encodeURIComponent(c)}" ${state.locked?"disabled":""}><b>${i+1}.</b> ${c}</button>`}).join("")}</div>`;
      if(!state.locked)html+=`<button id="checkExchange" class="check-btn" ${!state.selected?"disabled":""}>Check Answer</button>`;
      if(state.locked)html+=`<div class="function-tag">Function: ${q.function}</div><div class="feedback">${feedback(state.score>0)}<div class="explanation">${q.explanation}</div></div>`;
      shell(q,html);
      document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{state.selected=decodeURIComponent(btn.dataset.choice);sound("click");renderQuestion()});
      const check=document.getElementById("checkExchange");if(check)check.onclick=()=>{state.locked=true;state.score=state.selected===q.correctAnswer?q.points:0;score+=state.score;state.score?correct++:wrong++;sound(state.score?"good":"bad");renderQuestion()};
      keyboardChoices(q,state,true);
    }

    function keyboardChoices(q,state,isExchange){document.onkeydown=e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;const n=Number(e.key);const list=orderFor(q,"_choiceOrder",q.choices);if(n>=1&&n<=list.length&&!state.locked){const c=list[n-1];if(isExchange){state.selected=c;renderQuestion()}else{state.selected=c;state.locked=true;state.score=c===q.correctAnswer?q.points:0;score+=state.score;state.score?correct++:wrong++;renderQuestion()}}if(isExchange&&state.selected&&!state.locked&&(e.key==="Enter"||e.key===" ")){document.getElementById("checkExchange")?.click()}}}

    function renderQuestion(){document.onkeydown=null;const q=quizConfig.questions[index],state=answers[index];if(q.type==="drag-classify")renderDrag(q,state);else if(q.type==="complete-exchange")renderExchange(q,state);else renderSingle(q,state)}
    function tier(){if(score>=17)return["Excellent!","You can confidently express addition and concession in different contexts."];if(score>=12.5)return["Very Good!","You understand the main structures, but review some connectors and sentence patterns."];if(score>=8)return["Good!","You understand the basic functions. Practise choosing between addition and concession."];return["Keep Practising!","Review the difference between adding information and expressing contrast."]}

    /* Custom four-tier result remark animation and threshold-based confetti. */
    function showResults(){
      timer.pause();document.onkeydown=null;const [remark,message]=tier(),attempts=(Number(localStorage.getItem("addConAttempts"))||0)+1,best=Math.max(Number(localStorage.getItem("addConBest"))||0,score);
      localStorage.setItem("addConAttempts",attempts);localStorage.setItem("addConBest",best);localStorage.setItem("addConLast",score);localStorage.setItem("addConTime",timer.format());
      app.innerHTML=`<section class="result"><div style="font-weight:800;color:#2563eb">QUIZ • UNIT ${quizConfig.unit}</div><h1 style="color:#123c6b;margin:8px 0">${quizConfig.title}</h1><div>${quizConfig.lesson}</div><div class="score-badge">${scoreText(score)}<small>/20</small></div><div class="remark" id="remark">Good!</div><p id="message">${message}</p><div class="summary"><b>Performance Summary</b><br>Final Score: ${scoreText(score)} /20<br>Correct Answers: ${correct}<br>Wrong Answers: ${wrong}<br>Accuracy Percentage: ${Math.round((correct/16)*100)}%<br>Time Taken: ${timer.format()}<br>Number of Attempts: ${attempts}<br>Best Score: ${scoreText(best)} /20</div><div class="breakdown"><b>Per-question breakdown</b>${quizConfig.questions.map((q,i)=>`<div>${i+1}. ${q.category}: <b>${scoreText(answers[i].score)}/${q.points}</b></div>`).join("")}</div><div class="actions"><button class="action-btn" id="review">Review My Answers</button><button class="action-btn" id="print">Print Results</button><button class="action-btn" id="save">Save Results</button><button class="action-btn secondary" id="restart">Restart Quiz</button></div></section>`;
      let turns=0;const labels=["Excellent!","Very Good!","Good!","Keep Practising!"];const spin=setInterval(()=>{document.getElementById("remark").textContent=labels[turns++%4];if(turns>10){clearInterval(spin);document.getElementById("remark").textContent=remark}},110);
      if(score>=17)confetti();sound("good");
      document.getElementById("review").onclick=review;document.getElementById("print").onclick=()=>window.print();document.getElementById("save").onclick=saveReport;document.getElementById("restart").onclick=restart;
    }
    function confetti(){for(let i=0;i<90;i++){const x=document.createElement("i");x.className="confetti";x.style.left=Math.random()*100+"%";x.style.background=["#2563eb","#16a34a","#f59e0b","#dc2626"][i%4];x.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(x);setTimeout(()=>x.remove(),4200)}}
    function review(){app.innerHTML=`<section class="instruction">REVIEW MY ANSWERS</section>${quizConfig.questions.map((q,i)=>{const a=answers[i];if(q.type==="drag-classify"){return `<article class="review-item"><h3>${i+1}. ${q.category} — ${scoreText(a.score)}/${q.points}</h3>${q.tiles.map(t=>`<div>${t[1]} — Student's Column: <b>${a.placements[t[0]]||"Not placed"}</b> | Correct Column: <b>${t[2]}</b></div>`).join("")}<p>${q.explanation}</p></article>`}return `<article class="review-item"><h3>${i+1}. ${q.category} — ${scoreText(a.score)}/${q.points}</h3><p><b>Student Answer:</b> ${a.selected||"No answer"}</p><p><b>Correct Answer:</b> ${q.correctAnswer}</p>${q.function?`<span class="function-tag">Function: ${q.function}</span>`:""}<p>${q.explanation}</p></article>`}).join("")}<div class="actions"><button class="action-btn" id="backResults">Back to Results</button></div>`;document.getElementById("backResults").onclick=showResults}
    function saveReport(){const report=`English2BAC Quizzes\nUnit ${quizConfig.unit}: ${quizConfig.title}\n${quizConfig.lesson}\n\nFinal Score: ${scoreText(score)} /20\nCorrect: ${correct}\nWrong: ${wrong}\nTime Taken: ${timer.format()}\n\n${quizConfig.questions.map((q,i)=>`${i+1}. ${q.category}: ${scoreText(answers[i].score)}/${q.points}`).join("\n")}`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([report],{type:"text/plain"}));a.download="expressing-addition-concession-results.txt";a.click();URL.revokeObjectURL(a.href)}
    function restart(){index=0;score=0;correct=0;wrong=0;selectedTile=null;quizConfig.questions.forEach(q=>{delete q._choiceOrder;delete q._tileOrder});answers.forEach(a=>{a.locked=false;a.score=0;a.selected=null;a.placements={}});timer.reset();timer.start();renderQuestion()}
    timer.start();renderQuestion();
  </script>
 
</body></html>
