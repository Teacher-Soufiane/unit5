  <script>
/* ============ CONFIGURATION ============ */
const quizConfig = {
  unit: "5", title: "THE PASSIVE VOICE", lesson: "GRAMMAR QUIZ 1", teacherName: "Teacher Soufiane",
  randomizeQuestions: false, randomizeChoices: true,
  timerEnabled: true, timerMode: "countup", countdownSeconds: 600,
  showConfetti: true, enableSounds: true, totalPoints: 20,
  levels: [{"name": "Passive Voice Detective", "instr": "SPOT THE PASSIVE VOICE."}, {"name": "Build the Passive", "instr": "COMPLETE WITH THE CORRECT PASSIVE FORM."}, {"name": "Past Participle Trap Hunt", "instr": "CHOOSE THE CORRECT PASSIVE FORM."}, {"name": "Future and Modal Passive", "instr": "CHOOSE THE CORRECT PASSIVE FORM."}, {"name": "Active-to-Passive Transformer", "instr": "CHOOSE THE CORRECT PASSIVE TRANSFORMATION."}, {"name": "Future Tense Transformation", "instr": "CHOOSE THE CORRECT FUTURE PASSIVE."}, {"name": "Error Correction and Agent Detection", "instr": "CHOOSE THE CORRECT ANSWER."}, {"name": "BAC Final Boss", "instr": "BAC FINAL BOSS — CHOOSE THE CORRECT ANSWER."}],
  remarks: [
    {min: 18, label: "Excellent", text: "You have a very strong command of the passive voice across tenses, modals and transformations."},
    {min: 15, label: "Very Good", text: "You handle most passive forms well. Review the tenses and past participles where you lost points."},
    {min: 11, label: "Good Progress", text: "You understand the basics of the passive, but you need more practice with different tenses and past participles."},
    {min: 0, label: "Keep Practising", text: "Review the passive pattern (be + past participle), then practise it tense by tense."}
  ],
  questions: []
};
const Q = (level, task, choices, c, hint, explanation) => quizConfig.questions.push({
  type: "single-choice", level, category: quizConfig.levels[level - 1].name, question: quizConfig.levels[level - 1].instr,
  task, choices, correctAnswer: choices[c], explanation, hint, points: 1 });
Q(1, "Which sentence is written in the passive voice?", ["The school library opened last Monday.", "The school library was opened last Monday.", "The school library has open last Monday.", "The school library was opening last Monday."], 1,
  "Look for the pattern be + past participle, where the subject receives the action.",
  "“The school library was opened” uses was + past participle: the library receives the action.");
Q(1, "Which sentence correctly uses the passive voice?", ["The candidates were interviewed online.", "The candidates interviewed online.", "The candidates was interviewed online.", "The candidates were interview online."], 0,
  "Check that “be” agrees with the plural subject and is followed by a past participle.",
  "A plural subject takes “were” + past participle: “were interviewed”.");
Q(2, "Stories ______ by online newspapers to influence the public.", ["invent", "are invented", "are inventing", "is invented"], 1,
  "Present simple passive: the right form of “be” + a past participle. Check the subject.",
  "“Stories” is plural, so the present simple passive is “are invented”.");
Q(2, "A survey ______ about the needs of young people last week.", ["has conducted", "was conducted", "were conducted", "is being conducted"], 1,
  "“Last week” tells you the tense, and the subject is singular.",
  "“Last week” signals the past simple, so: “was conducted” (singular subject).");
Q(2, "The road ______ at the moment, so drivers must use another route.", ["is widened", "has widened", "is being widened", "was being widen"], 2,
  "“At the moment” signals an action in progress.",
  "“At the moment” needs the present continuous passive: “is being widened”.");
Q(3, "At 8 p.m. yesterday, the stage ______ for the ceremony.", ["was being decorated", "was decorated", "were being decorated", "had being decorated"], 0,
  "The action was in progress at a specific moment in the past.",
  "A past action in progress at 8 p.m. needs the past continuous passive: “was being decorated”.");
Q(3, "Surveillance cameras ______ in many schools already.", ["have installed", "have been installed", "has been installed", "were being install"], 1,
  "“Already” links the past to the present, and the subject is plural.",
  "Present perfect passive with a plural subject: “have been installed”.");
Q(3, "By the time the guests arrived, the room ______.", ["has been prepared", "was preparing", "had been prepared", "had prepared"], 2,
  "The preparation happened before another past event.",
  "“By the time” + an earlier past action needs the past perfect passive: “had been prepared”.");
Q(4, "More stadiums ______ for the 2030 World Cup.", ["will build", "will be built", "are built", "will been built"], 1,
  "For a future passive, think about what comes after “will”.",
  "Future passive = will + be + past participle: “will be built”.");
Q(4, "To protect the environment, bags ______ instead of single-use plastic bags.", ["should reuse", "should be reused", "should been reused", "are should reused"], 1,
  "After a modal verb, the passive needs “be” and a past participle.",
  "Modal passive = modal + be + past participle: “should be reused”.");
Q(5, "The storm destroyed several houses last night. Choose the correct passive form.", ["Several houses destroyed by the storm last night.", "Several houses were destroyed by the storm last night.", "Several houses have destroyed by the storm last night.", "Several houses were destroying by the storm last night."], 1,
  "Keep the same tense as the active sentence (past simple).",
  "Past simple passive with a plural subject: “were destroyed”.");
Q(5, "The computer company launched a new website in 2025. Choose the correct passive form.", ["A new website launched by the computer company in 2025.", "A new website was launching by the computer company in 2025.", "A new website was launched by the computer company in 2025.", "A new website has launch by the computer company in 2025."], 2,
  "Keep the same tense as the active sentence and use a past participle.",
  "Past simple passive with a singular subject: “was launched”.");
Q(5, "The jury has selected all the finalists. Choose the correct passive form.", ["All the finalists have been selected by the jury.", "All the finalists has selected by the jury.", "All the finalists were selected by the jury.", "All the finalists have been select by the jury."], 0,
  "The active verb is in the present perfect — keep that tense.",
  "Present perfect passive with a plural subject: “have been selected”.");
Q(6, "The school will publish the results tomorrow. Choose the correct passive form.", ["The results will publish tomorrow.", "The results are published tomorrow.", "The results will be published tomorrow.", "The results will been published tomorrow."], 2,
  "Keep the future form and add “be” plus a past participle.",
  "Future passive = will + be + past participle: “will be published”.");
Q(7, "Find the correct correction of this sentence: <i>The invitations were send yesterday.</i>", ["The invitations were sent yesterday.", "The invitations was sent yesterday.", "The invitations were sended yesterday.", "The invitations are sent yesterday."], 0,
  "Check the past participle of the irregular verb “send”.",
  "The past participle of “send” is irregular: “sent”. So: “were sent”.");
Q(7, "The mechanic is repairing the computer now. Which passive sentence keeps the same tense?", ["The computer is repaired now.", "The computer is being repaired now.", "The computer was being repaired now.", "The computer has been repairing now."], 1,
  "The active verb is in the present continuous — keep it.",
  "Present continuous passive: “is being repaired”.");
Q(7, "In the sentence <i>“An e-commerce platform was developed by the company,”</i> who performed the action?", ["The e-commerce platform", "The company", "The customers", "The sentence does not identify the agent."], 1,
  "In a passive sentence, the agent usually follows “by”.",
  "The agent (the doer) follows “by”: “by the company”.");
Q(8, "Someone stole my bicycle last night. Choose the best passive transformation without naming the unknown agent.", ["My bicycle stole last night.", "My bicycle was stolen last night.", "My bicycle has stolen last night.", "My bicycle was steal last night."], 1,
  "Use “be” plus the correct past participle of the irregular verb “steal”.",
  "Past simple passive: “was stolen”. The unknown agent (“someone”) is dropped.");
Q(8, "The final reports ______ yet, so the director cannot review them.", ["have not submitted", "have not been submitted", "were not submitted yet", "have not been submit"], 1,
  "“Yet” links a negative situation to the present, and the subject is plural.",
  "Negative present perfect passive: “have not been submitted”.");
Q(8, "The new policy ______ after a long discussion yesterday.", ["was approved", "has approved", "approved by the committee", "was approve"], 0,
  "“Yesterday” gives the tense, and the verb needs “be” + a past participle.",
  "Past simple passive with “yesterday”: “was approved”.");

/* ============ TIMER MODULE (independent of rendering) ============ */
const Timer = {
  seconds: 0, id: null,
  format(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); },
  start(onTick) { if (this.id) return; this.id = setInterval(() => { this.seconds += quizConfig.timerMode === "countdown" ? -1 : 1; onTick(this.seconds); }, 1000); },
  pause() { clearInterval(this.id); this.id = null; },
  reset() { this.pause(); this.seconds = quizConfig.timerMode === "countdown" ? quizConfig.countdownSeconds : 0; }
};

/* ============ SOUNDS (Web Audio, no files) ============ */
let audioCtx;
function playTones(notes, type) {
  if (!quizConfig.enableSounds) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.13;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.22);
    });
  } catch (e) {}
}
const soundCorrect = () => playTones([660, 880], "sine"), soundWrong = () => playTones([220, 180], "triangle"),
      soundDone = () => playTones([523, 659, 784, 1046], "sine");

/* ============ STATE ============ */
const $ = id => document.getElementById(id);
const questions = quizConfig.questions, total = questions.length;
let order = [], answers = [], current = 0, finished = false;
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function initState() {
  order = questions.map(q => { const idx = q.choices.map((_, i) => i); return quizConfig.randomizeChoices ? shuffle(idx) : idx; });
  answers = questions.map(() => ({ picked: null, locked: false, hint: false }));
  current = 0; finished = false;
}
const isRight = i => answers[i].locked && questions[i].choices[answers[i].picked] === questions[i].correctAnswer;
const correctCount = () => questions.filter((_, i) => isRight(i)).length;
const answeredCount = () => answers.filter(a => a.locked).length;

/* ============ RENDERING ============ */
function updateStats() {
  const c = correctCount(), a = answeredCount();
  $("stCorrect").textContent = c; $("stWrong").textContent = a - c; $("stRemain").textContent = total - a;
  $("stScore").textContent = c.toFixed(2) + " /20"; $("stProgress").textContent = a + " / " + total; $("stTimer").textContent = Timer.format(Math.max(0, Timer.seconds));
}
function showQuestion(i) {
  current = i; const q = questions[i], a = answers[i];
  $("instr").textContent = q.question; $("task").innerHTML = q.task;
  $("counter").textContent = (i + 1) + " / " + total;
  $("hintText").textContent = q.hint; $("hintText").hidden = !a.hint;
  const box = $("choices"); box.innerHTML = "";
  order[i].forEach((origIdx, pos) => {
    const b = document.createElement("button"); b.className = "tile"; b.dataset.pos = pos;
    b.textContent = (pos + 1) + ". " + q.choices[origIdx];
    b.onclick = () => selectChoice(pos); box.appendChild(b);
  });
  if (a.locked) paintResult(i); else { $("feedback").textContent = ""; $("explanation").hidden = true; }
  $("prevBtn").disabled = i === 0; $("nextBtn").disabled = !a.locked;
  $("next-label").hidden = i === total - 1; $("finish-label").hidden = i !== total - 1;
  updateStats();
}
function paintResult(i) {
  const q = questions[i], a = answers[i], ok = isRight(i);
  [...$("choices").children].forEach((t, pos) => {
    const text = q.choices[order[i][pos]]; t.disabled = true;
    if (text === q.correctAnswer) t.classList.add("correct"); else if (order[i][pos] === a.picked) t.classList.add("wrong");
  });
  const good = ["Excellent!", "Great Job!", "Perfect!", "Keep Going!"], bad = ["Almost!", "Review this rule.", "Keep learning!", "You'll get the next one!"];
  if (!a.msg) a.msg = (ok ? good : bad)[Math.floor(Math.random() * 4)];
  $("feedback").textContent = a.msg; $("feedback").className = "feedback canva-text " + (ok ? "ok" : "bad");
  $("explanation").textContent = q.explanation; $("explanation").hidden = false;
}
function selectChoice(pos) {
  const a = answers[current]; if (a.locked || finished) return;
  a.picked = order[current][pos]; a.locked = true;
  const ok = isRight(current); paintResult(current);
  ok ? soundCorrect() : soundWrong();
  $("nextBtn").disabled = false; updateStats();
}
function goNext() {
  if (!answers[current].locked) return;
  current < total - 1 ? showQuestion(current + 1) : showResults();
}
function goPrev() { if (current > 0) showQuestion(current - 1); }

/* ============ RESULTS ============ */
function levelBreakdown() {
  return quizConfig.levels.map((lv, n) => {
    const idx = questions.map((q, i) => q.level === n + 1 ? i : -1).filter(i => i >= 0);
    return { name: "Level " + (n + 1) + " — " + lv.name, got: idx.filter(isRight).length, of: idx.length };
  });
}
function getRemark(score) { return quizConfig.remarks.find(r => score >= r.min); }
function showResults() {
  finished = true; Timer.pause();
  const score = correctCount(), r = getRemark(score), time = Timer.format(Math.abs(Timer.seconds));
  let store = {};
  try { store = JSON.parse(localStorage.getItem("unit5PassiveQuiz1") || "{}"); } catch (e) {}
  store.attempts = (store.attempts || 0) + 1; store.best = Math.max(store.best || 0, score); store.last = score; store.time = time;
  try { localStorage.setItem("unit5PassiveQuiz1", JSON.stringify(store)); } catch (e) {}
  $("quizView").hidden = true; $("reviewView").hidden = true; $("resultView").hidden = false;
  $("finalScore").textContent = score.toFixed(2);
  const rows = [["Final Score", score.toFixed(2) + " /20"], ["Correct Answers", score], ["Wrong Answers", total - score],
    ["Accuracy", Math.round(score / total * 100) + "%"], ["Time Taken", time], ["Number of Attempts", store.attempts], ["Best Score", store.best.toFixed(2) + " /20"]]
    .concat(levelBreakdown().map(l => [l.name, l.got + "/" + l.of]));
  $("summary").innerHTML = rows.map(x => "<div><b>" + x[0] + ":</b> " + x[1] + "</div>").join("");
  window.lastReport = { score, time, rows, remark: r };
  spinRemark(r); soundDone();
  if (quizConfig.showConfetti && score >= 18) launchConfetti();
}
function spinRemark(final) {
  const labels = ["Keep Practising", "Good Progress", "Very Good", "Excellent"]; let n = 0, delay = 60, elapsed = 0;
  $("remarkText").textContent = "";
  (function step() {
    if (elapsed >= 3000) { $("remark").textContent = final.label; $("remarkText").textContent = final.text; return; }
    $("remark").textContent = labels[n++ % 4]; elapsed += delay; delay *= 1.12; setTimeout(step, delay);
  })();
}
function launchConfetti() {
  const cv = $("confetti"), ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, v: 2 + Math.random() * 4, s: 5 + Math.random() * 6, c: ["#2563eb", "#16a34a", "#dc2626", "#facc15", "#1e3a5f"][Math.floor(Math.random() * 5)] }));
  const end = Date.now() + 4000;
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.y += p.v; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); });
    Date.now() < end ? requestAnimationFrame(frame) : ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}
function showReview() {
  $("resultView").hidden = true; $("reviewView").hidden = false; let html = "", lastLevel = 0;
  questions.forEach((q, i) => {
    if (q.level !== lastLevel) { lastLevel = q.level; html += '<div class="rev-level">Level ' + q.level + " — " + quizConfig.levels[q.level - 1].name + "</div>"; }
    const ok = isRight(i);
    html += '<div class="rev ' + (ok ? "ok" : "bad") + '"><b>Q' + (i + 1) + ".</b> " + q.task + "<br><b>Your answer:</b> " + (answers[i].picked === null ? "—" : q.choices[answers[i].picked]) +
      "<br><b>Correct answer:</b> " + q.correctAnswer + "<br><b>Explanation:</b> " + q.explanation + "</div>";
  });
  $("reviewList").innerHTML = html;
}
function reportText() { const r = window.lastReport; return "ENGLISH2BAC QUIZZES — Unit " + quizConfig.unit + " • " + quizConfig.title + " • " + quizConfig.lesson + "\n\n" + r.rows.map(x => x[0] + ": " + x[1]).join("\n") + "\n\nRemark: " + r.remark.label; }
function printResults() {
  const r = window.lastReport;
  $("printArea").innerHTML = "<h2>English2BAC Quizzes — Unit " + quizConfig.unit + "</h2><h3>" + quizConfig.title + " — " + quizConfig.lesson + "</h3>" + r.rows.map(x => "<p><b>" + x[0] + ":</b> " + x[1] + "</p>").join("") + "<p><b>Remark:</b> " + r.remark.label + "</p>";
  window.print();
}
function saveResults() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([reportText()], { type: "text/plain" }));
  a.download = "unit5-grammar-quiz1-results.txt"; a.click(); URL.revokeObjectURL(a.href);
}
function restartQuiz() {
  Timer.reset(); initState();
  $("resultView").hidden = true; $("reviewView").hidden = true; $("quizView").hidden = false;
  showQuestion(0); Timer.start(() => { if (quizConfig.timerMode === "countdown" && Timer.seconds <= 0) { Timer.pause(); showResults(); } else updateStats(); });
}

/* ============ EVENTS ============ */
$("hintBtn").onclick = () => { if (!answers[current].locked) { answers[current].hint = true; $("hintText").hidden = false; } };
$("nextBtn").onclick = goNext; $("prevBtn").onclick = goPrev;
$("reviewBtn").onclick = showReview; $("backBtn").onclick = () => { $("reviewView").hidden = true; $("resultView").hidden = false; };
$("printBtn").onclick = printResults; $("saveBtn").onclick = saveResults;
$("restartBtn").onclick = restartQuiz; $("restartBtn2").onclick = restartQuiz;
document.addEventListener("keydown", e => {
  if ($("quizView").hidden) return;
  if (["1", "2", "3", "4"].includes(e.key)) selectChoice(+e.key - 1);
  else if (e.key === "ArrowRight" || e.key === "Enter" || e.key === " ") { e.preventDefault(); goNext(); }
  else if (e.key === "ArrowLeft") goPrev();
});
restartQuiz();
</script>
